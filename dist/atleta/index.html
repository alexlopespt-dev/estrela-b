<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3d0914">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Estrela B">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://script.google.com https://script.googleusercontent.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Estrela B — Atleta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>:root{
  --grena:#6b1426; --grena-d:#3d0914; --verde:#1c6a3d; --ouro:#f2bd4b;
  --bg:#f3f1ef; --surface:#fff; --surface-2:#f6f3f2; --line:#e6e0de; --text:#221216; --muted:#76666a;
  --ok:#1f7a3d; --warn:#b8860b; --bad:#c62828;
  --fb:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; --fc:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root{ --bg:#140a0d; --surface:#1f1417; --surface-2:#281b1f; --line:#3a2a2f; --text:#f3e9ec; --muted:#b39ea4; --ok:#5fcf85; --warn:#e8c15a; --bad:#ff7a7a; color-scheme:dark; } }
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--fb);font-size:16px;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;color:inherit}
.top{background:linear-gradient(160deg,#6a1030,#34061a);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 18px 22px;border-radius:0 0 26px 26px;position:relative;overflow:hidden}
.top::after{content:"";position:absolute;right:-30px;top:-10px;width:170px;height:200px;background:var(--wm) center/contain no-repeat;opacity:.08;pointer-events:none}
.top-r{display:flex;align-items:center;gap:12px}
.top img{width:44px;height:52px;object-fit:contain;flex:none}
.top small{display:block;color:#f2bd4bcc;font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.top h1{margin:2px 0 0;font:800 26px/1.05 var(--fc);letter-spacing:.01em}
.top p{margin:10px 0 0;color:#ffffffc0;font-size:14px}
main{padding:14px 14px calc(96px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;margin:0 0 12px;box-shadow:0 1px 2px rgba(61,9,20,.05),0 10px 24px -18px rgba(61,9,20,.35)}
.card h2{margin:0 0 4px;font:700 19px/1.2 var(--fb)}
.card .sub{color:var(--muted);font-size:14px;margin:0}
.k{font:700 12px var(--fb);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border:0;border-radius:14px;background:var(--grena);color:#fff;font-weight:700;font-size:17px;margin-top:12px}
.cta:disabled{opacity:.45}
.cta.sec{background:var(--surface-2);color:var(--text);border:1px solid var(--line);font-size:15px;min-height:44px}
.done{display:flex;align-items:center;gap:10px;margin-top:10px}
.tick{width:34px;height:34px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.pend{display:inline-block;margin-top:10px;padding:6px 10px;border-radius:999px;background:color-mix(in srgb,var(--warn) 18%,transparent);font-size:13px;font-weight:700}
.row{display:flex;gap:10px;align-items:center}
.ev{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.ev:first-of-type{border-top:0}
.ev .d{width:52px;text-align:center;flex:none}
.ev .d b{display:block;font:800 24px/1 var(--fc)}.ev .d span{font-size:12px;color:var(--muted);text-transform:uppercase;font-weight:700}
.ev .t{flex:1;min-width:0}.ev .t b{display:block}.ev .t span{color:var(--muted);font-size:14px}
.tag{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--surface-2);border:1px solid var(--line)}
.tag.jogo{background:#6a1030;color:#fff;border-color:transparent}
.tag.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);border-color:transparent;color:var(--ok)}
.day{font:700 13px var(--fb);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:14px 4px 6px}
.folga{color:var(--muted);font-size:14px;padding:4px 4px 0}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.nums div{background:var(--surface-2);border-radius:14px;padding:10px;text-align:center}
.nums b{display:block;font:800 28px/1 var(--fc)}.nums span{font-size:12px;color:var(--muted);font-weight:600}
.bars{display:flex;align-items:flex-end;gap:4px;height:84px;margin-top:10px}
.bars i{flex:1;border-radius:4px 4px 0 0;min-height:3px;position:relative}
.bars-x{display:flex;gap:4px;font-size:10px;color:var(--muted);margin-top:4px}.bars-x span{flex:1;text-align:center}
.list{margin:8px 0 0;padding:0;list-style:none}
.list li{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.num{width:30px;height:30px;border-radius:9px;background:var(--grena);color:#fff;display:grid;place-items:center;font:800 16px var(--fc);flex:none}
.eu{background:color-mix(in srgb,var(--ouro) 22%,transparent);border-radius:10px;margin:0 -6px;padding:8px 6px!important}
.banner{display:flex;gap:12px;align-items:center;background:linear-gradient(160deg,#6a1030,#34061a);color:#fff;border:0}
.banner b{display:block;font-size:17px}.banner span{color:#ffffffc9;font-size:14px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:10}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;color:var(--muted);font-size:12px;font-weight:700;padding:4px 0;min-height:48px}
nav.tabs svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--grena)}
@media (prefers-color-scheme:dark){ nav.tabs button[aria-current="page"]{color:var(--ouro)} }
/* formulários (ecrã inteiro) */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;padding:calc(12px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom))}
.sheet-in{max-width:560px;margin:0 auto}
.sheet-h{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.sheet-h h2{margin:0;font:800 24px var(--fc);flex:1}
.x{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:20px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;margin:0 0 12px}
.q h3{margin:0 0 10px;font-size:17px}
.q h3 small{display:block;color:var(--muted);font-weight:500;font-size:13px;margin-top:2px}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:12px;min-height:50px;border:2px solid var(--line);border-radius:14px;background:var(--surface-2);padding:6px 12px;text-align:left;font-weight:600}
.opt i{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font:800 18px var(--fc);font-style:normal;color:#fff;flex:none}
.opt[aria-pressed="true"]{border-color:var(--grena);background:color-mix(in srgb,var(--grena) 10%,var(--surface))}
@media (prefers-color-scheme:dark){ .opt[aria-pressed="true"]{border-color:var(--ouro);background:color-mix(in srgb,var(--ouro) 12%,var(--surface))} }
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border-radius:999px;border:2px solid var(--line);background:var(--surface-2);font-weight:700}
.chip[aria-pressed="true"]{border-color:var(--grena);background:var(--grena);color:#fff}
.dur{display:flex;align-items:center;gap:10px}
.dur button{width:52px;height:52px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);font-size:22px;font-weight:700}
.dur input{flex:1;height:52px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-align:center;font:800 26px var(--fc);min-width:0}
.rpe .opt{min-height:44px}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.empty b{display:block;color:var(--text);font-size:18px;margin-bottom:6px}
.note{font-size:13px;color:var(--muted);margin:8px 2px}
.off{background:color-mix(in srgb,var(--warn) 16%,transparent);border-radius:12px;padding:8px 12px;font-size:13px;margin:0 0 12px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#2a0a12;color:#fff;padding:12px 16px;border-radius:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:30;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.ok-big{text-align:center;padding:40px 10px}
.ok-big .tick{width:84px;height:84px;font-size:40px;margin:0 auto 16px}
.ok-big h2{font:800 28px var(--fc);margin:0 0 6px}
a{color:inherit}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

const LSK = "estrela-atleta-v1";
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ls = { get(k,d){ try{ const v=localStorage.getItem(LSK+k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(LSK+k,JSON.stringify(v)); }catch(e){} }, del(k){ try{ localStorage.removeItem(LSK+k); }catch(e){} } };
const pad = n => String(n).padStart(2,"0");
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => isoOf(new Date());
const toD = iso => { const [y,m,d]=String(iso).split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (iso,n) => { const d=toD(iso); d.setDate(d.getDate()+n); return isoOf(d); };
const fmt = (iso,o) => toD(iso).toLocaleDateString("pt-PT",o);
const cap = s => s ? s.charAt(0).toUpperCase()+s.slice(1) : s;
const dayName = iso => iso===today()?"Hoje":iso===addDays(today(),1)?"Amanhã":cap(fmt(iso,{weekday:"long"}));
const first = n => String(n||"").trim().split(/\s+/)[0];
const lbl = t => String(t||"").replace(/^\s*\d+(?:[.,]\d+)?\s*[-–—.:]?\s*/,"");   // "3 - Normal" → "Normal"
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove("show"),2800); }

/* ---- ligação: o link pessoal chega no endereço (#s=…&t=…) e fica guardado ---- */
(function(){
  const h=new URLSearchParams(location.hash.replace(/^#/,""));
  if(h.get("s")&&h.get("t")){
    const cfg={s:h.get("s"),t:h.get("t")};
    if(!S.cfg||S.cfg.t!==cfg.t){ S.data=null; ls.del(":dados"); }
    S.cfg=cfg; ls.set(":cfg",cfg);
  }
  if(location.hash) try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){}
})();

/* ---- pedidos ao script (fetch; se o browser bloquear, JSONP) ---- */
function jsonp(u){
  return new Promise((res,rej)=>{
    const cb="__at"+Date.now().toString(36), s=document.createElement("script");
    const end=()=>{ try{ delete window[cb]; }catch(e){} s.remove(); clearTimeout(tm); };
    const tm=setTimeout(()=>{ end(); rej(new Error("tempo")); },20000);
    window[cb]=d=>{ end(); res(d); }; s.onerror=()=>{ end(); rej(new Error("rede")); };
    s.src=u+"&cb="+cb; document.head.appendChild(s);
  });
}
async function apiGet(){
  const u=S.cfg.s+(S.cfg.s.includes("?")?"&":"?")+"a=atleta&t="+encodeURIComponent(S.cfg.t)+"&_="+Date.now();
  try{ const r=await fetch(u); if(!r.ok) throw new Error("HTTP "+r.status); return await r.json(); }
  catch(e){ return await jsonp(u); }
}
async function apiPost(body){
  const r=await fetch(S.cfg.s,{method:"POST",body:JSON.stringify({...body,t:S.cfg.t})});
  const j=await r.json(); if(j.erro) throw Object.assign(new Error(j.msg||j.erro),{srv:true,link:j.erro==="link"}); return j;
}
async function load(manual){
  if(!S.cfg||S.loading) return;
  S.loading=true; if(manual) render();
  try{
    const d=await apiGet();
    if(d.erro){ S.err = d.erro==="link" ? "link" : (d.msg||d.erro); }
    else { S.data=d; S.at=new Date().toISOString(); S.err=""; ls.set(":dados",d); ls.set(":dados_em",S.at); }
  }catch(e){ S.err="rede"; }
  S.loading=false; render();
  if(manual && S.err==="rede") toast("Sem ligação — a mostrar os últimos dados.");
}
/* ---- respostas: enviadas logo; sem rede ficam na fila ---- */
async function send(item){
  item.quando=new Date().toISOString();   // conta para a hora em que respondeu, mesmo que só seja enviado mais tarde
  try{ const r=await apiPost(item); return r; }
  catch(e){
    if(e.srv){ throw e; }
    S.fila=S.fila.filter(x=>!(x.a===item.a&&x.a==="atleta_bem"&&x.d===item.d)); S.fila.push(item); ls.set(":fila",S.fila); return {fila:true};
  }
}
async function flush(){
  if(!S.cfg||!S.fila.length||flush.on) return; flush.on=true;
  const rest=[];
  for(const it of S.fila){
    if(Date.now()-new Date(it.quando).getTime()>36*3600e3) continue;   // mais de 36 h: já não entram nas contas desse dia
    try{ await apiPost(it); }catch(e){ if(!e.srv) rest.push(it); }
  }
  const sent=S.fila.length-rest.length; S.fila=rest; ls.set(":fila",rest); flush.on=false;
  if(sent){ toast("Respostas guardadas no telemóvel enviadas ✓"); load(); }
}
window.addEventListener("online",()=>{ flush(); load(); });
document.addEventListener("visibilitychange",()=>{ if(!document.hidden){ flush(); load(); } });

  const v={hoje:vHoje,agenda:vAgenda,jogo:vJogo,eu:vEu}[S.tab]();
  const nav=`<nav class="tabs" aria-label="Secções">${[["hoje","Hoje"],["agenda","Agenda"],["jogo","Jogo"],["eu","Eu"]].map(([k,l])=>`<button data-a="tab" data-t="${k}" ${S.tab===k?'aria-current="page"':""}>${IC[k]}${l}</button>`).join("")}</nav>`;
  const sheet=S.view==="bem"?vBemForm():S.view==="pse"?vPseForm():S.view&&S.view.t?vObrigado():"";

}

  tab:el=>{ S.tab=el.dataset.t; S.view=null; window.scrollTo(0,0); render(); },
  refresh:()=>{ flush(); load(true); },
  sair:()=>{ if(!window.confirm||window.confirm("Desligar a app deste telemóvel? Vais precisar do link outra vez.")){ ls.del(":cfg"); ls.del(":dados"); ls.del(":fila"); S.cfg=null; S.data=null; render(); } },
  fechar:()=>{ S.view=null; S.form=null; render(); },
  bem:()=>{ const b=S.data&&S.data.respostas&&S.data.respostas.bem; S.form={i:b?b.i.slice():[0,0,0,0]}; S.view="bem"; render(); $(".sheet").scrollTop=0; },
  bemOpt:el=>{ const j=+el.dataset.j; S.form.i[j]=+el.dataset.n; const sc=$(".sheet").scrollTop; render(); const sh=$(".sheet"); sh.scrollTop=sc;
    const nx=$("#q"+(j+1)); if(nx&&!S.form.i[j+1]) nx.scrollIntoView({behavior:"smooth",block:"start"}); else if(S.form.i.every(v=>v)) $(".sheet .cta").scrollIntoView({behavior:"smooth",block:"end"}); },
  bemEnviar:async()=>{ const f=S.form; if(!f.i.every(v=>v)||f.busy) return; f.busy=true; render();
    try{ const r=await send({a:"atleta_bem",i:f.i,d:today()});
      if(r.fila){ S.view={t:"Guardado no telemóvel",s:"Sem rede agora — enviamos assim que houver ligação."}; }
      else { const tot=f.i.reduce((s,v)=>s+v,0); S.view={t:r.corrigido?"Corrigido":"Obrigado!",s:`Bem-estar de hoje: ${tot}/20.`}; load(); }
    }catch(e){ f.busy=false; if(e.link){ S.err="link"; S.view=null; } else toast(e.message||"Não foi possível enviar."); }
    S.form=null; render(); },
  pse:()=>{ const t=today(), ev=((S.data&&S.data.agenda)||[]).filter(a=>a.date===t), g=ev.find(a=>a.tipo==="jogo"), tr=ev.find(a=>a.tipo==="treino");
    const tipos=(S.data&&S.data.opcoes&&S.data.opcoes.pse&&S.data.opcoes.pse.tipos)||[];
    const pick=w=>tipos.find(x=>x.toLowerCase().startsWith(w))||(w==="jogo"?"Jogo":"Treino");
    const tipo=g?pick("jogo"):tr?pick("treino"):null, dur=g?(g.dur||90):tr?(tr.dur||90):60;
    S.form={tipo,dur,rpe:null,sen:null}; S.view="pse"; render(); $(".sheet").scrollTop=0; },
  pseTipo:el=>{ S.form.tipo=el.dataset.v; keep(); },
  pseDur:el=>{ const i=$("#pseDur"); S.form.dur=Math.max(5,Math.min(300,(parseInt(i.value,10)||0)+ +el.dataset.n)); keep(); },
  pseRpe:el=>{ S.form.rpe=+el.dataset.n; keep(); },
  pseSen:el=>{ S.form.sen=S.form.sen===el.dataset.v?null:el.dataset.v; keep(); },
  pseEnviar:async()=>{ const f=S.form; const di=$("#pseDur"); if(di) f.dur=parseInt(di.value,10)||f.dur;
    if(!(f.tipo&&f.rpe!=null&&f.dur>0)||f.busy) return; f.busy=true; render();
    try{ const r=await send({a:"atleta_pse",tipo:f.tipo,dur:f.dur,rpe:f.rpe,sen:f.sen||"",d:today()});
      S.view = r.fila ? {t:"Guardado no telemóvel",s:"Sem rede agora — enviamos assim que houver ligação."} : {t:r.corrigido?"Corrigido":"Obrigado!",s:`${f.tipo} · PSE ${f.rpe} · ${f.dur} min.`};
      if(!r.fila) load();
    }catch(e){ f.busy=false; if(e.link){ S.err="link"; S.view=null; } else toast(e.message||"Não foi possível enviar."); }
    S.form=null; render(); }
};
function keep(){ const sh=$(".sheet"), sc=sh?sh.scrollTop:0; const di=$("#pseDur"); if(di&&S.form&&document.activeElement===di) S.form.dur=parseInt(di.value,10)||S.form.dur; render(); const s2=$(".sheet"); if(s2) s2.scrollTop=sc; }
document.addEventListener("click",e=>{ const el=e.target.closest("[data-a]"); if(!el) return; const fn=A[el.dataset.a]; if(fn) fn(el,e); });
document.addEventListener("input",e=>{ if(e.target.id==="pseDur"&&S.form){ S.form.dur=parseInt(e.target.value,10)||0; const b=$(".sheet .cta"); const ok=S.form.tipo&&S.form.rpe!=null&&S.form.dur>0; if(b){ b.disabled=!ok; b.textContent=ok?"Enviar":"Escolhe a sessão, o tempo e o esforço"; } } });
render(); flush(); load();
setInterval(()=>{ if(!document.hidden&&!S.view) load(); }, 5*60*1000);

})();
</script>
</body>
</html>
