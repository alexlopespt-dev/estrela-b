  if(!r.ok) throw new Error(j.msg||j.message||j.error_description||j.error_code||j.error||("HTTP "+r.status));
  return j;
}
function sbSave(){ try{ if(SB.s) localStorage.setItem(SB_SES,JSON.stringify(SB.s)); else localStorage.removeItem(SB_SES); }catch(e){} }
function sbSet(j){ SB.s={access_token:j.access_token,refresh_token:j.refresh_token,expires_at:+j.expires_at||Math.floor(Date.now()/1000)+(+j.expires_in||3600)}; if(j.user) SB.user=j.user; sbSave(); }
function sbRefresh(){
  if(!SB.s||!SB.s.refresh_token) return Promise.reject(new Error("jwt expired"));
  if(!sbRefresh.p) sbRefresh.p=sbAuth("token?grant_type=refresh_token",{refresh_token:SB.s.refresh_token}).then(sbSet).finally(()=>{ sbRefresh.p=null; });
  return sbRefresh.p;
}
async function sbReq(path,{method="GET",body,headers={},raw=false,retry=true}={}){
  if(!SB.s) throw new Error("jwt expired");
  if(SB.s.expires_at-Date.now()/1000<60){ try{ await sbRefresh(); }catch(e){ sbLost(); throw e; } }
  const blob=typeof Blob!=="undefined"&&body instanceof Blob;
  const r=await fetch(SB_URL+path,{method,headers:{apikey:SB_KEY,Authorization:"Bearer "+SB.s.access_token,...(body!==undefined&&!blob?{"Content-Type":"application/json"}:{}),...headers},
    body:body===undefined?undefined:blob?body:JSON.stringify(body)});
  if(r.status===401&&retry){ try{ await sbRefresh(); }catch(e){ sbLost(); throw e; } return sbReq(path,{method,body,headers,raw,retry:false}); }
  if(raw&&r.ok) return r.blob();
  const t=await r.text(); let j=null; try{ j=t?JSON.parse(t):null; }catch(e){ j=t; }
  if(!r.ok) throw new Error((j&&(j.message||j.msg||j.error))||("HTTP "+r.status));
  return j;
}
const sbRpc = (fn,args) => sbReq("/rest/v1/rpc/"+fn,{method:"POST",body:args||{}});
function sbLost(){ SB.s=null; sbSave(); SB.gate="login"; SB.err="A sessão terminou. Entra outra vez."; sbGate(); }

function sbUse(n){ if(n==="db") return sbReadyP.then(()=>sbDb); if(n==="assets") return sbReadyP.then(()=>sbAssets); return Promise.resolve(null); }
async function sbBoot(){

  const inv=(String(h.get("convite")||"").match(/[0-9a-f-]{36}/i)||[])[0];
  if(inv){ try{ localStorage.setItem(SB_INV,inv); }catch(e){} SB.info="Tens um convite para entrar numa equipa. Entra (ou cria conta) com o email para onde foi enviado."; }
  let type=null;
  if(h.get("access_token")){ sbSet({access_token:h.get("access_token"),refresh_token:h.get("refresh_token"),expires_in:h.get("expires_in"),expires_at:h.get("expires_at")}); type=h.get("type"); }
  if(h.get("error_description")||h.get("error_code")) SB.err=sbMsg(h.get("error_code")+" "+h.get("error_description"));
  if(location.hash) try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){}

  catch(e){ SB.s=null; sbSave(); SB.gate="login"; return sbGate(); }

  if(type==="signup") SB.info="Email confirmado. Bem-vindo!";
  await sbAfterLogin();
}

async function sbAfterLogin(){
  SB.gate="loading"; sbGate();
  let inv=null; try{ inv=localStorage.getItem(SB_INV); }catch(e){}
  if(inv){
    try{ const t=await sbRpc("accept_invite",{p_token:inv}); try{ localStorage.setItem(SB_TEAM,t); }catch(e){} SB.info="Entraste na equipa."; }
    catch(e){ SB.err="Convite: "+sbMsg(e); }
    try{ localStorage.removeItem(SB_INV); }catch(e){}

async function sbTeams(){

/* ---- dados: documentos da equipa (tabela docs), receção de 15 em 15 s pela versão (v) ---- */
const SBD = {map:{}, lis:{}, maxV:0, ready:false, timer:null};
COLS.forEach(c=>SBD.map[c]={});
function sbEmit(c){ const docs=Object.entries(SBD.map[c]).map(([id,d])=>({id,data:()=>d})); (SBD.lis[c]||[]).forEach(l=>l.next({docs,size:docs.length})); }
async function sbPage(q){
  const out=[];
  for(let off=0;;off+=1000){
    const r=await sbReq(`/rest/v1/docs?select=col,id,data,v,deleted&team_id=eq.${SB.team.id}${q}&order=v.asc&limit=1000&offset=${off}`);
    out.push(...(r||[])); if(!r||r.length<1000) break;
  }
  return out;
}
function sbApply(r){ if(r.v>SBD.maxV) SBD.maxV=r.v; if(!COLS.includes(r.col)) return false; if(r.deleted) delete SBD.map[r.col][r.id]; else SBD.map[r.col][r.id]=r.data; return true; }
async function sbLoad(){
  try{ (await sbPage("&deleted=is.false")).forEach(sbApply); SBD.ready=true; COLS.forEach(sbEmit); }
  catch(e){ toast("Não foi possível carregar os dados: "+sbMsg(e)); COLS.forEach(c=>(SBD.lis[c]||[]).forEach(l=>l.err&&l.err(e))); setTimeout(sbLoad,15000); return; }
  clearInterval(SBD.timer); SBD.timer=setInterval(sbPoll,15000);
}
async function sbPoll(){
  if(!SBD.ready||sbPoll.on||document.hidden||!SB.s) return;
  sbPoll.on=true;
  try{ const ch=new Set(); (await sbPage(`&v=gt.${SBD.maxV}`)).forEach(r=>{ if(sbApply(r)) ch.add(r.col); }); ch.forEach(sbEmit); }
  catch(e){} finally{ sbPoll.on=false; }
}
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) sbPoll(); });
window.addEventListener("online",()=>sbPoll());
const sbWhere = (c,id) => `team_id=eq.${SB.team.id}&col=eq.${encodeURIComponent(c)}&id=eq.${encodeURIComponent(id)}`;
function sbFail(e){
  const m=sbMsg(e);
  if(/permissão/.test(m)){ toast(`Não tens permissão para alterar isto (${ROLE_L[SB.role]||SB.role}).`); const x=new Error(m); x.shown=true; return x; }
  return e;
}
const sbDb = {
  collection:c=>({ onSnapshot:(next,err)=>{ (SBD.lis[c]=SBD.lis[c]||[]).push({next,err}); if(SBD.ready) setTimeout(()=>sbEmit(c),0); return ()=>{}; } }),
  doc:path=>{ const i=path.indexOf("/"), c=path.slice(0,i), id=path.slice(i+1); return {
    set:async o=>{
      try{ await sbReq("/rest/v1/docs?on_conflict=team_id,col,id",{method:"POST",body:{team_id:SB.team.id,col:c,id,data:o,deleted:false},headers:{Prefer:"resolution=merge-duplicates,return=minimal"}}); }
      catch(e){ throw sbFail(e); }
      SBD.map[c][id]=clone(o); },
    delete:async()=>{
      let r; try{ r=await sbReq("/rest/v1/docs?"+sbWhere(c,id),{method:"PATCH",body:{deleted:true},headers:{Prefer:"return=representation"}}); }
      catch(e){ throw sbFail(e); }
      if(Array.isArray(r)&&!r.length&&SBD.map[c][id]) throw sbFail(new Error("row-level security"));   // sem permissão, nada mudou
      delete SBD.map[c][id]; } }; },
  failed:c=>setTimeout(()=>sbEmit(c),0)   // o servidor recusou: volta a mostrar o que está guardado
};

// tentativas falhadas de entrada, por email, neste dispositivo: 5 em 15 min → espera (1 min, depois 2, 4… até 15).
// O limite a sério é o da Supabase (Authentication → Rate Limits), que vale para todos os dispositivos.
const SB_TRY = LS+":tentativas";
function sbTries(){ try{ return JSON.parse(localStorage.getItem(SB_TRY)||"{}"); }catch(e){ return {}; } }
function sbTryWait(email){ const t=sbTries()[String(email).toLowerCase()]; return t&&t.until>Date.now()?Math.ceil((t.until-Date.now())/1000):0; }
function sbTryFail(email){
  const all=sbTries(), k=String(email).toLowerCase(), now=Date.now(), t=all[k]&&now-all[k].first<15*60e3?all[k]:{n:0,first:now,until:0};
  t.n++; if(t.n>=5) t.until=now+Math.min(15*60e3,60e3*Math.pow(2,t.n-5));
  all[k]=t; try{ localStorage.setItem(SB_TRY,JSON.stringify(all)); }catch(e){}
}
function sbTryOk(email){ const all=sbTries(); delete all[String(email).toLowerCase()]; try{ localStorage.setItem(SB_TRY,JSON.stringify(all)); }catch(e){} }
const sbWaitTxt = s => s>=90?`${Math.ceil(s/60)} minutos`:`${s} segundos`;
const SBF = {
  login:v=>sbDo(async()=>{
    SB.email=v.email; const w=sbTryWait(v.email);
    if(w) throw new Error(`Demasiadas tentativas falhadas. Espera ${sbWaitTxt(w)} e tenta de novo (ou recupera a palavra-passe).`);
    let j; try{ j=await sbAuth("token?grant_type=password",{email:v.email,password:v.pass}); }
    catch(e){ if(/invalid login credentials/i.test(String(e.message))) sbTryFail(v.email); throw e; }
    sbTryOk(v.email); sbSet(j); SB.info=""; await sbAfterLogin(); }),
  signup:v=>sbDo(async()=>{
    if((v.pass||"").length<8) throw new Error("password at least 8 characters");
    SB.email=v.email;
    const j=await sbAuth("signup?redirect_to="+encodeURIComponent(location.origin+location.pathname),{email:v.email,password:v.pass,data:{name:v.name}});
    if(j.access_token){ sbSet(j); await sbAfterLogin(); } else { SB.gate="sent"; }
  }),
  recover:v=>sbDo(async()=>{ SB.email=v.email; await sbAuth("recover?redirect_to="+encodeURIComponent(location.origin+location.pathname),{email:v.email}); SB.gate="recsent"; }),
  newpass:v=>sbDo(async()=>{
    if((v.pass||"").length<8) throw new Error("password at least 8 characters");
    await sbReq("/auth/v1/user",{method:"PUT",body:{password:v.pass}}); SB.info="Palavra-passe guardada."; await sbAfterLogin(); }),
  invite:v=>sbDo(async()=>{
    const t=(String(v.inv||"").match(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i)||[])[0];
    if(!t) throw new Error("Convite inválido");
    try{ localStorage.setItem(SB_INV,t); }catch(e){} await sbAfterLogin(); }),
  club:v=>sbDo(async()=>{
    const id=await sbRpc("create_club",{p_name:v.club,p_team:v.team,p_season:v.season||null,p_comp:v.comp||null});
    const full=`${v.club.trim()} — ${v.team.trim()}`, rows=[
      {col:"meta",id:"team",data:{team:v.team.trim(),full,club:v.club.trim(),season:v.season||"",comp:v.comp||""}},
      {col:"meta",id:"cfg",data:{exCats:CLUBE_BASE.exCats}},
      ...Object.entries(CLUBE_BASE.statdefs).map(([k,d])=>({col:"statdefs",id:k,data:d}))];
    await sbReq("/rest/v1/docs",{method:"POST",body:rows.map(r=>({team_id:id,...r})),headers:{Prefer:"return=minimal"}});
    try{ localStorage.setItem(SB_TEAM,id); }catch(e){}
    SB.info=`Clube criado. Começa por acrescentar os atletas em Plantel.`; await sbAfterLogin(); })
};
document.addEventListener("submit",e=>{
  const f=e.target.closest&&e.target.closest("form[data-sbf]"); if(!f) return;

/* ---- registo de erros (Sentry, alojado na UE) ----
   Cliente mínimo, sem biblioteca: envia o erro (tipo, mensagem, linhas do código) para o endereço do DSN.
   Não envia dados pessoais: só o id da conta e da equipa, a função e o separador. No máximo 20 erros por sessão. */
const ERRS = {n:0, seen:new Set()};
function errReport(e,extra){
  if(!SENTRY_DSN) return;
  try{
    const m=SENTRY_DSN.match(/^https:\/\/([0-9a-z]+)@([^/]+)\/(\d+)$/i); if(!m) return;
    const err=e instanceof Error?e:new Error(String((e&&e.message)||e));
    const key=err.name+":"+err.message; if(ERRS.seen.has(key)||ERRS.n>=20) return; ERRS.seen.add(key); ERRS.n++;
    const id=(crypto.randomUUID?crypto.randomUUID():uid("e")+Date.now()).replace(/-/g,"").slice(0,32).padEnd(32,"0"), now=new Date().toISOString();
    const frames=String(err.stack||"").split("\n").map(l=>{ const x=l.match(/(?:at\s+(?:(.*?)\s+\()?)?(?:(.*?)@)?(\S+?):(\d+):(\d+)\)?\s*$/);
      return x?{function:x[1]||x[2]||"?",filename:String(x[3]).replace(/[#?].*$/,""),lineno:+x[4],colno:+x[5]}:null; }).filter(Boolean).slice(0,30).reverse();
    const ev={event_id:id,timestamp:now,platform:"javascript",level:"error",environment:SB_ENV||"producao",release:"app-equipa-tecnica@"+BUILD,
      exception:{values:[{type:err.name||"Error",value:String(err.message||"").slice(0,500),...(frames.length?{stacktrace:{frames}}:{})}]},
      request:{url:location.origin+location.pathname,headers:{"User-Agent":navigator.userAgent}},
      ...(SB.user?{user:{id:SB.user.id}}:{}),
      tags:{equipa:(SB.team&&SB.team.id)||"",funcao:SB.role||"",separador:S.tab||""}, extra:extra||{}};
    const body=JSON.stringify({event_id:id,sent_at:now})+"\n"+JSON.stringify({type:"event"})+"\n"+JSON.stringify(ev);
    fetch(`https://${m[2]}/api/${m[3]}/envelope/?sentry_key=${m[1]}&sentry_version=7`,{method:"POST",body,keepalive:true}).catch(()=>{});
  }catch(x){}
}
window.addEventListener("error",ev=>errReport(ev.error||ev.message,{origem:"janela"}));
window.addEventListener("unhandledrejection",ev=>errReport(ev.reason,{origem:"promessa"}));

/* ================= monitorização (Google Sheets: bem-estar, PSE, prontidão) ================= */
// A app lê o resumo publicado pelo Apps Script do ficheiro "Estrela B - Painel" (MON_FILE) (ver tools/apps-script/ligacao_app.gs).
// O endereço e a chave ficam em meta/cfg; o último resumo recebido fica guardado neste browser para abrir sem rede.
const MON = { data:null, at:null, err:"", loading:false };
const MON_FILE = EDITION==="clubes" ? "Painel de monitorização" : "Estrela B - Painel";   // nome do ficheiro Google Sheets nas mensagens
const MON_LS = LS+":mon";
try{ const c=JSON.parse(localStorage.getItem(MON_LS)||"null"); if(c&&c.data){ MON.data=c.data; MON.at=c.at; } }catch(e){}
const monCfg = () => cfg().mon || {};
const nameKey = s => String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9 ]/g,"").replace(/\s+/g," ").trim();

async function monFetch(manual){
  const c=monCfg(); if(!c.url){ if(manual) toast("Liga primeiro ao Google Sheets."); return; }
  if(MON.loading) return;
  MON.loading=true; MON.err=""; schedule();
  const ctl=typeof AbortController!=="undefined"?new AbortController():null, tm=setTimeout(()=>ctl&&ctl.abort(),25000);
  try{
    const u=c.url.trim()+(c.url.includes("?")?"&":"?")+"k="+encodeURIComponent(c.key||"");
    let d;
    try{ const r=await fetch(u,{signal:ctl?ctl.signal:undefined}); if(!r.ok) throw new Error("HTTP "+r.status); d=await r.json(); }
    catch(e){ if(e&&e.name==="AbortError") throw e; d=await monJsonp(u); }   // leitura direta bloqueada pelo browser: tenta por <script>
    if(d.erro) throw new Error(d.erro==="chave"?"A chave não está certa.":d.erro==="pedido desconhecido"?monWrongScript(c.url):d.erro);
    if(!Array.isArray(d.jogadores)) throw new Error("A resposta não tem jogadores.");
    const antes=MON.data&&MON.data.atualizado;
    MON.data=d; MON.at=new Date().toISOString();
    monSnap(d);
    try{ localStorage.setItem(MON_LS,JSON.stringify({data:d,at:MON.at})); }catch(e){}
    if(manual){ const t=monCalc(); toast(antes&&antes===d.atualizado ? `Sem dados novos — o último cálculo do Sheets continua a ser o de ${t}. Recalcula a cada resposta aos formulários e de 6 em 6 horas.` : `Dados novos do Sheets (calculados ${t}) — ${d.jogadores.length} jogadores`); }
  }catch(e){
    MON.err = e&&e.name==="AbortError" ? "O Google demorou demasiado a responder." : (e&&e.message&&!/fetch|network|load/i.test(e.message) ? e.message : "Não foi possível ligar ao Google Sheets. Se tens um bloqueador de anúncios (AdBlock, uBlock…), desliga-o para este site; senão confirma a rede e o endereço.");
    if(manual) toast(MON.err);
  }finally{ clearTimeout(tm); MON.loading=false; VER++; schedule(); }
}
// "pedido desconhecido" só é dado pelo script da partilha (dados_app.gs): o endereço não chega ao doGet da monitorização.
function monWrongScript(u){
  let s=""; try{ s=(JSON.parse(localStorage.getItem(LS+":sync")||"null")||{}).url||""; }catch(e){}
  return s&&s.trim()===String(u).trim()
    ? "A Monitorização e a Partilha estão ligadas ao mesmo endereço, e ele responde como o script da partilha (dados_app.gs). Quase de certeza o dados_app.gs está dentro do projeto da monitorização: tem de passar para um projeto à parte, com URL próprio (ver as instruções no topo do dados_app.gs)."
    : "O endereço responde como o script da partilha (dados_app.gs), não o da monitorização. Confirma em “Ligação ao Sheets” que o URL é o da monitorização; se o dados_app.gs foi colado dentro do projeto da monitorização, os dois doGet chocam — tem de ficar num projeto à parte.";
}
// Segundo caminho (JSONP): o Apps Script devolve cb(dados) quando recebe ?cb=; não depende de CORS.
function monJsonp(u){
  return new Promise((res,rej)=>{
    const cb="__estrelaMon"+Date.now().toString(36), s=document.createElement("script");
    const fail=()=>{ end(); rej(new Error("O browser bloqueou a ligação ao Google (confirma extensões como AdBlock/uBlock) ou o script ainda não tem a versão nova (Implementar → Gerir implementações → Nova versão).")); };
    const end=()=>{ try{ delete window[cb]; }catch(e){ window[cb]=undefined; } s.remove(); clearTimeout(t); };
    const t=setTimeout(()=>{ end(); rej(new Error("O Google demorou demasiado a responder.")); },20000);
    window[cb]=d=>{ end(); res(d); };
    s.onerror=fail;
    s.onload=()=>{ if(window[cb]) fail(); };   // carregou mas não chamou cb: script antigo (devolve só JSON)
    s.src=u+"&cb="+cb; document.head.appendChild(s);
  });
}
function monAuto(){ const c=monCfg(); if(!c.url) return; if(MON.at && Date.now()-new Date(MON.at).getTime()<10*60*1000) return; monFetch(false); }

/* ligação nome da folha -> atleta da app: igual, depois abreviaturas ("João Silva" = "João S."), depois o que foi escolhido à mão */
function monMatch(){
  const d=MON.data; if(!d) return {map:{},miss:[]};
  const man=monCfg().map||{}, pls=allPlayers(), map={}, used=new Set();
  const names=d.jogadores.map(j=>j.nome);
  names.forEach(n=>{ if(man[n]!==undefined){ if(man[n] && D.players[man[n]]){ map[n]=man[n]; used.add(man[n]); } else map[n]=null; } });
  names.forEach(n=>{ if(n in map) return; const p=pls.find(p=>!used.has(p.id)&&nameKey(p.name)===nameKey(n)); if(p){ map[n]=p.id; used.add(p.id); } });
  const tok = s => nameKey(s).split(" ").filter(Boolean);
  const fits = (app,sheet) => { const a=tok(app), s=tok(sheet); return a.length && a.every(t=>s.some(x=>x===t||(t.length===1&&x.startsWith(t)))); };
  names.forEach(n=>{ if(n in map) return; const c=pls.filter(p=>!used.has(p.id)&&fits(p.name,n)); if(c.length===1){ map[n]=c[0].id; used.add(c[0].id); } });
  const miss=names.filter(n=>!(n in map));
  return {map,miss};
}
function monOf(pid){ const d=MON.data; if(!d) return null; const {map}=monMatch(); const n=Object.keys(map).find(k=>map[k]===pid); return n?d.jogadores.find(j=>j.nome===n)||null:null; }

/* cores iguais às do Sheets */
function monCol(s){ if(s==null) return "var(--surface-2)"; const t=Math.max(0,Math.min(1,s/100)); const h=v=>Math.round(v);
  if(t<.5){ const u=t/.5; return `rgb(${h(248+7*u)},${h(105+130*u)},${h(107+25*u)})`; } const u=(t-.5)/.5; return `rgb(${h(255-156*u)},${h(235-45*u)},${h(132-9*u)})`; }
const MON_EST = {RISCO:"bad","PICO DE CARGA":"bad","Atenção":"warn","A subir":"warn",Normal:"ok","Carga baixa":"blue"};
const monTag = v => v ? `<span class="tag ${MON_EST[v]||""}">${esc(v)}</span>` : "";
const monScore = (s,big) => `<span class="mscore ${big?"big":""}" style="background:${monCol(s)}">${s==null?"–":esc(s)}</span>`;
const n2 = x => x==null ? "–" : String(Math.round(x*100)/100).replace(".",",");
function spark(vals,{min=1,max=5,bars=false,w=112,h=26,folga}={}){
  const n=vals.length; if(!n) return "";
  if(bars){ const mx=Math.max(1,...vals.map(v=>v||0)), bw=w/n;
    return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true">${vals.map((v,i)=>`<rect x="${(i*bw+1).toFixed(1)}" y="${(h-(v||0)/mx*(h-2)).toFixed(1)}" width="${(bw-2).toFixed(1)}" height="${((v||0)/mx*(h-2)).toFixed(1)}" fill="${folga&&folga[i]?"#b9aeb2":"var(--grena)"}"/>`).join("")}</svg>`; }
  const X=i=>(n===1?w/2:i*(w-4)/(n-1)+2), Y=v=>h-2-(Math.max(min,Math.min(max,v))-min)/(max-min)*(h-4);
  let d="", pen=false; vals.forEach((v,i)=>{ if(v==null){ pen=false; return; } d+=(pen?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1); pen=true; });
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true"><line x1="0" x2="${w}" y1="${Y(3).toFixed(1)}" y2="${Y(3).toFixed(1)}" stroke="var(--line)"/><path d="${d}" fill="none" stroke="var(--verde)" stroke-width="2"/>${vals.map((v,i)=>v==null?"":`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="1.8" fill="var(--verde)"/>`).join("")}</svg>`;
}

function monCalc(){ const a=MON.data&&MON.data.atualizado?new Date(MON.data.atualizado):null; return a&&!isNaN(a)?a.toLocaleString("pt-PT",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):"—"; }
function monAge(){ if(!MON.data) return ""; const a=MON.data.atualizado?new Date(MON.data.atualizado):null;
  const t=a&&!isNaN(a)?a.toLocaleString("pt-PT",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):"";

function monCard(){
  const c=monCfg();
  if(!c.url) return `<section class="card"><div class="card-h"><h3>Prontidão e bem-estar</h3><button class="btn sm" data-a="monCfg">Ligar ao Sheets</button></div><div class="empty"><b>Painel de monitorização por ligar</b>Liga o ficheiro "${MON_FILE}" para veres aqui a prontidão, o bem-estar e a carga.</div></section>`;

    <div class="list two">${top.length?top.map(j=>{ const p=map[j.nome]?P(map[j.nome]):null;

      :`<div class="empty"><b>Sem sinais de alerta</b></div>`}</div></section>`;
}

  rows.sort((a,b)=>{ const x=val(a), y=val(b); return (x>y?1:x<y?-1:0)*dir || String(a.nome).localeCompare(b.nome); });
  const cols=[["nome","Atleta"],["estado","Estado"],["prontidao","Prontidão"],["condicao","Condição"],["confianca","Confiança"],["bem3","Bem-estar 3d"],["z","Z-score"],["critico","Item crítico"],["carga7","Carga 7d"],["acwr","ACWR"],["monotonia","Monotonia"],["estadoBem","Bem-estar"],["estadoCarga","Carga"],["",`Bem-estar ${(d.dias||[]).length}d`],["","Carga diária"],["leitura","Leitura"]];
  const cnt=x=>js.filter(j=>j.estadoBem===x).length, med=com.length?Math.round(avg(com.map(j=>j.prontidao))):null;
  const nm=j=>{ const p=map[j.nome]?P(map[j.nome]):null; return p?`<button class="lnk pin" data-a="page" data-p="atleta" data-id="${esc(p.id)}">${avatar(p)}<b>${esc(p.name)}</b></button>`:`<div class="pin"><span class="ph g-X">${esc(initials(j.nome))}</span><b>${esc(j.nome)}</b></div>`; };
  const md=monMd(d);
  return head+sub+`

    <div class="kpi"><span>Sem resposta</span><b>${cnt("sem resposta")}<small> de ${js.length}</small></b></div>
    <div class="kpi"><span>ACWR</span><b style="font-size:17px">${d.acwrFiavel?"Fiável":"Ainda não"}<small> ${esc(d.diasHist||0)} dias de histórico</small></b></div>
  </div>
  ${miss.length?`<p class="note" style="margin:0 0 10px">Sem ligação ao plantel da app: <b>${miss.map(esc).join(", ")}</b>. <button class="lnk" style="text-decoration:underline" data-a="monCfg">Escolher o atleta</button></p>`:""}
  <div class="chips" style="margin-bottom:10px">${[["","Todos ("+js.length+")"],["al","Com alerta"],["ind","Indisponíveis/condicionados"],["gr","Guarda-redes"]].map(([k2,l])=>`<button class="chip ${flt===k2?"on":""}" data-a="monF" data-k="${k2}">${l}</button>`).join("")}</div>

}

/* ---- respostas do dia (bem-estar e PSE tal como foram dadas nos formulários) ---- */
// Estado igual ao da folha de respostas: total (4-20) até 12 = risco, 13-16 = atenção, 17+ = OK.
const monHooper = t => t==null?null : t<=12?{l:"Risco",c:"bad"} : t<=16?{l:"Atenção",c:"warn"} : {l:"OK",c:"ok"};
const monRv = v => v==null?"var(--surface-2)":monCol((v-1)/4*100);
function monRespDias(r){ const s=new Set(); (r.bem||[]).forEach(x=>s.add(x.d)); (r.pse||[]).forEach(x=>s.add(x.d)); return [...s].sort().reverse(); }
function monResp(d){
  const r=d.respostas;
  if(!r) return `<div class="empty"><b>O script do Sheets ainda não envia as respostas</b>Cola a versão nova do <b>monitorizacao_completo.gs</b> no Apps Script do "${MON_FILE}" e corre “Atualizar agora” no menu ⚽ Monitorização. Depois carrega em Atualizar aqui.</div>`;
  const dias=monRespDias(r);
  if(!dias.length) return `<div class="empty"><b>Sem respostas nos últimos 7 dias</b></div>`;
  const dia=dias.includes(S.monDia)?S.monDia:dias[0], t=todayISO();
  const dl=x=>x===t?"Hoje":x===addDays(t,-1)?"Ontem":cap1(fmtD(x,{weekday:"short",day:"numeric",month:"numeric"}).replace(".",""));
  const {map}=monMatch(), nm=n=>{ const p=map[n]?P(map[n]):null; return p?p.name:n; };
  const who=n=>{ const p=map[n]?P(map[n]):null; return p?`<button class="lnk pin" data-a="page" data-p="atleta" data-id="${esc(p.id)}">${avatar(p)}<b>${esc(p.name)}</b></button>`:`<div class="pin"><span class="ph g-X">${esc(initials(n))}</span><b>${esc(n)}</b></div>`; };
  const bem=(r.bem||[]).filter(x=>x.d===dia), pse=(r.pse||[]).filter(x=>x.d===dia);
  const tot=x=>(x.i||[]).every(v=>typeof v==="number")?x.i.reduce((a,b)=>a+b,0):null;
  const tots=bem.map(tot).filter(v=>v!=null), cnt=c=>tots.filter(v=>monHooper(v).l===c).length;
  const disp=d.jogadores.filter(j=>!j.estado||j.estado==="Disponível"||j.estado==="Condicionado").map(j=>j.nome);
  const falta=l=>disp.filter(n=>!l.some(x=>x.n===n)).map(nm).sort((a,b)=>a.localeCompare(b));
  const fB=falta(bem), fP=falta(pse), pr=pse.filter(x=>typeof x.rpe==="number"), pc=pse.filter(x=>typeof x.c==="number");
  const lbl=(x,k)=>{ const v=(x.i||[])[k], s=String((x.t||[])[k]||"").replace(/^\s*\d+\s*[-–—.]\s*/,""); return `<td><span class="rv" style="background:${monRv(v)}">${v==null?"–":esc(v)}</span>${s?`<small>${esc(s)}</small>`:""}</td>`; };
  const nb=x=>x.nb&&x.nb!==x.n&&nameKey(x.nb)!==nameKey(nm(x.n))?`<div class="small muted">escreveu “${esc(x.nb)}”</div>`:"";
  const n1=v=>String(Math.round(v*10)/10).replace(".",",");
  return `<div class="chips" style="margin-bottom:12px">${dias.map(x=>`<button class="chip ${x===dia?"on":""}" data-a="monDia" data-d="${x}">${esc(dl(x))}</button>`).join("")}</div>
  <div class="kpis" style="margin-bottom:14px">
    <div class="kpi"><span>Bem-estar</span><b>${bem.length}<small> respostas${disp.length?" de "+disp.length:""}</small></b></div>
    <div class="kpi"><span>Média do total</span><b>${tots.length?n1(avg(tots)):"–"}<small> de 20</small></b></div>
    <div class="kpi"><span>Risco / atenção / OK</span><b${cnt("Risco")?' style="color:var(--r5)"':""}>${cnt("Risco")} / ${cnt("Atenção")} / ${cnt("OK")}</b></div>
    <div class="kpi"><span>PSE</span><b>${pse.length}<small> registos</small></b></div>
    <div class="kpi"><span>PSE médio</span><b>${pr.length?n1(avg(pr.map(x=>x.rpe))):"–"}<small> de 10</small></b></div>
    <div class="kpi"><span>Carga média</span><b>${pc.length?Math.round(avg(pc.map(x=>x.c))):"–"}<small> UA</small></b></div>
  </div>
  <section class="card"><div class="card-h"><h3>Bem-estar — ${esc(dl(dia).toLowerCase()==="hoje"?"hoje":dl(dia))}</h3><span class="sub">${bem.length} respostas</span></div>
    ${bem.length?`<div class="tscroll"><table class="tb mon resp"><thead><tr><th>Hora</th><th class="l stk">Jogador</th><th>Sono</th><th>Fadiga</th><th>Dor muscular</th><th>Stress</th><th>Total</th><th>Estado</th></tr></thead><tbody>
    ${bem.map(x=>{ const v=tot(x), h=monHooper(v); return `<tr><td class="num">${esc(x.h||"")}</td><td class="l stk">${who(x.n)}${nb(x)}</td>${[0,1,2,3].map(k=>lbl(x,k)).join("")}<td class="num"><b>${v==null?"–":v}</b></td><td>${h?`<span class="tag ${h.c}">${h.l}</span>`:""}</td></tr>`; }).join("")}
    </tbody></table></div>`:`<div class="empty"><b>Sem respostas de bem-estar neste dia</b></div>`}
    ${fB.length&&bem.length?`<p class="small muted" style="margin:0;padding:10px 14px">Sem resposta: ${fB.map(esc).join(", ")}${dia===t?` <button class="btn sm" data-a="faltaOpen" data-k="bem">Lembrar</button>`:""}</p>`:""}</section>
  <section class="card"><div class="card-h"><h3>PSE — ${esc(dl(dia).toLowerCase()==="hoje"?"hoje":dl(dia))}</h3><span class="sub">${pse.length} registos</span></div>
    ${pse.length?`<div class="tscroll"><table class="tb mon resp"><thead><tr><th>Hora</th><th class="l stk">Jogador</th><th>Sessão</th><th>Duração</th><th>PSE</th><th>Carga</th><th class="l">Sensação</th></tr></thead><tbody>
    ${pse.map(x=>`<tr><td class="num">${esc(x.h||"")}</td><td class="l stk">${who(x.n)}${nb(x)}</td><td class="small">${esc(x.tipo||"–")}</td><td class="num">${x.dur==null?"–":esc(x.dur)+"'"}</td><td><span class="rv" style="background:${x.rpe==null?"var(--surface-2)":monCol(100-(x.rpe-1)/9*100)}">${x.rpe==null?"–":esc(x.rpe)}</span></td><td class="num">${x.c==null?"–":Math.round(x.c)}</td><td class="small" style="text-align:left">${esc(x.sen||"")}</td></tr>`).join("")}
    </tbody></table></div>`:`<div class="empty"><b>Sem registos de PSE neste dia</b>${dia===t?"O PSE é preenchido depois do treino.":""}</div>`}
    ${fP.length&&pse.length?`<p class="small muted" style="margin:0;padding:10px 14px">Sem PSE: ${fP.map(esc).join(", ")}${dia===t?` <button class="btn sm" data-a="faltaOpen" data-k="pse">Lembrar</button>`:""}</p>`:""}</section>
  <p class="note">Respostas tal como foram dadas nos formulários (últimos 7 dias), lidas no último cálculo do Sheets — ${esc(monAge())}. Total do bem-estar = sono + fadiga + dor + stress (4 a 20): até 12 risco, 13-16 atenção, 17+ OK, como na folha de respostas. Carga = duração × PSE.</p>`;
}

/* ---- quem ainda não respondeu hoje (bem-estar de manhã; PSE depois de acabar a sessão do dia) ----
   Esperados = disponíveis e condicionados da monitorização. Botão WhatsApp por atleta (para o número dele, se estiver na ficha,
   com o link pessoal da app do atleta quando existe) e uma lista só com nomes para o grupo. */
function monFalta(){
  const d=MON.data; if(!d||!d.respostas) return null;
  const t=todayISO(), r=d.respostas, {map}=monMatch();

const MONH_LS = LS+":monhist";

    Object.keys(h).sort().slice(0,-21).forEach(k=>delete h[k]); localStorage.setItem(MONH_LS,JSON.stringify(h)); }catch(e){}
}
function monPrev(d){ try{ const h=JSON.parse(localStorage.getItem(MONH_LS)||"{}"); const k=Object.keys(h).filter(x=>x<d.hoje).sort().pop(); return k&&dayDiff(k,d.hoje)<=3?{date:k,v:h[k]}:null; }catch(e){ return null; } }
// Dia do microciclo contado a partir de HOJE: primeiro pelo calendário da app (próximo jogo até 7 dias),
// senão pelo resumo do Sheets acertado pelos dias que passaram desde que foi gerado (um resumo de ontem não diz "MD-2" hoje).

  if(d&&d.md&&d.md.falta!=null&&d.hoje){ const f=d.md.falta-dayDiff(d.hoje,t); if(f>=0) return {...d.md,etiqueta:lab(f),falta:f,folga:fol,jogo:addDays(t,f)}; }

const preJogoOk = d => { if(!d) return false; const f=monMd(d).falta; return f===0||f===1; };
const pj1 = x => x==null||!isFinite(x)?"—":(Math.round(x*10)/10).toLocaleString("pt-PT");

/* ---- gráficos (SVG estático, uma medida por gráfico) ---- */
const pjNice = m => { const r=m/4, p=Math.pow(10,Math.floor(Math.log10(Math.max(r,1e-9)))), st=[1,2,2.5,5,10].map(k=>k*p).find(k=>k>=r); return {step:st, max:Math.max(st,Math.ceil(m/st-1e-9)*st)}; };

  (o.lines||[]).forEach(L=>{ const x=X(L.v); s+=`<line x1="${x}" y1="0" x2="${x}" y2="${H-22}" stroke="${L.c}" stroke-width="1.5" stroke-dasharray="4 3"/><text x="${x+3}" y="${H-24}" fill="${L.c}" font-weight="700" font-size="8.5">${esc(L.l)}</text>`; });

      <text x="${LW+w+3}" y="${y+rh-2}" fill="${PJ.ink2}" font-weight="700">${esc(r.t??pj0(r.v))}</text>`; });

function pjDiverging(rows,o){   // variação: positivo verde à direita, negativo vermelho à esquerda, zero ao centro
  const W=380, LW=76, rh=11, gap=3, H=rows.length*(rh+gap)+28, m=Math.max(0.01,...rows.map(r=>Math.abs(r.v))), C=LW+(W-LW-12)/2, half=(W-LW-60)/2, X=v=>C+half*v/m;

  rows.forEach((r,i)=>{ const y=i*(rh+gap)+2, x0=Math.min(C,X(r.v)), w=Math.max(1.5,Math.abs(X(r.v)-C)), c=r.v>0?PJ.pos:r.v<0?PJ.neg:PJ.mute;

function pjPaired(rows){   // prontidão (grená) e condição (dourado) lado a lado, 0–100
  const W=380, LW=76, rh=5, gap=4, H=rows.length*(rh*2+gap)+28, X=v=>LW+(W-LW-22)*Math.max(0,Math.min(100,v||0))/100;

function pjTeam(d){   // dois gráficos lado a lado, alinhados pelo dia: carga diária da equipa (barras) e bem-estar médio (linha) — nunca dois eixos

function countdown(g){
  const [h,m]=String(g.time||"15:00").split(":").map(Number), k=toD(g.date); k.setHours(h||0,m||0,0,0);
  const ms=k-Date.now(), dd=dayDiff(todayISO(),g.date);
  if(dd===0) return ms>0?`${Math.floor(ms/36e5)}H ${pad(Math.floor(ms%36e5/6e4))}M`:"HOJE";
  if(ms<=0) return "HOJE";
  const d=Math.floor(ms/864e5), hh=Math.floor(ms%864e5/36e5);
  return d ? `${d}D ${pad(hh)}H` : `${hh}H ${pad(Math.floor(ms%36e5/6e4))}M`;
}

function monRing(v){
  const r=34, c=2*Math.PI*r, k=v==null?0:Math.max(0,Math.min(100,v))/100;
  return `<svg class="ring" viewBox="0 0 84 84" width="84" height="84"><defs><linearGradient id="rg" x1="0" x2="1"><stop offset="0" stop-color="#8f2239"/><stop offset="1" stop-color="#f2bd4b"/></linearGradient></defs>
    <circle cx="42" cy="42" r="${r}" fill="none" stroke="var(--line)" stroke-width="9"/><circle cx="42" cy="42" r="${r}" fill="none" stroke="url(#rg)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${(c*k).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 42 42)"/>
    <text x="42" y="51" text-anchor="middle" font-family="Barlow Condensed,Arial Narrow,sans-serif" font-weight="800" font-size="27" fill="var(--text)">${v==null?"–":Math.round(v)}</text></svg>`;
}
// frase curta e etiqueta para cada jogador que precisa de atenção
function monAttn(j){
  const n1=x=>String(Math.round(x*10)/10).replace(".",","), n2=x=>String(Math.round(x*100)/100).replace(".",",");
  if(j.estado&&j.estado!=="Disponível") return {t:`${j.estado}${j.estadoNota?" · "+j.estadoNota:""}`,l:"Clínico",c:"ok"};
  if(j.estadoBem==="sem resposta"||j.prontidao==null) return {t:j.nResp?`Sem respostas recentes`:"Ainda sem respostas",l:"Perguntar",c:"warn"};
  const crit=j.critico?` · ${String(j.critico).replace(/\s*\(([\d.]+)\)/,(m,v)=>" "+n1(+v)).toLowerCase()}`:"";
  if(j.prontidao<50||j.estadoBem==="RISCO") return {t:`Prontidão ${Math.round(j.prontidao)}${crit}`,l:"Decidir",c:"bad"};
  if(j.estadoCarga==="PICO DE CARGA") return {t:`Pico de carga${j.acwr!=null?` (ACWR ${n2(j.acwr)})`:""}`,l:"Gerir minutos",c:"warn"};
  if(j.estadoCarga==="A subir") return {t:`Carga a subir depressa${j.acwr!=null?` (ACWR ${n2(j.acwr)})`:""}`,l:"Gerir minutos",c:"warn"};
  if(j.estadoBem==="Atenção") return {t:`Bem-estar abaixo do habitual${crit}`,l:"Vigiar",c:"warn"};
  return {t:`Prontidão ${Math.round(j.prontidao)}${crit}`,l:"Vigiar",c:"warn"};
}
function monPanel(){

  const js=d.jogadores, disp=js.filter(j=>j.estado==="Disponível"||!j.estado), com=disp.filter(j=>j.prontidao!=null);

  const m7=c7.length?avg(c7):null, mcr=cr.length?avg(cr):null, dif=m7!=null&&mcr?Math.round((m7/mcr-1)*100):null;
  const nd=(d.dias||[]).length, daily=(d.dias||[]).map((_,i)=>{ const v=disp.map(j=>(j.serieCarga||[])[i]).filter(x=>x!=null); return v.length?avg(v):0; }), mx=Math.max(1,...daily);

/* ================= dados partilhados (versão Netlify): Google Sheets via Apps Script ================= */
// Cada dispositivo continua a guardar tudo no browser (funciona sem rede) e, se estiver ligado, envia as suas
// alterações para o Apps Script (secção 11 de tools/apps-script/monitorizacao_completo.gs) e recebe as dos outros.
// - put/del chamam syncQ: a alteração fica numa fila (guardada no browser) até o servidor a confirmar.
// - de SYNC_MS em SYNC_MS (e ao voltar à app) pede as alterações desde a última versão recebida.
// - enquanto há alteração local por enviar para um registo, a versão do servidor desse registo é ignorada.
// A ligação (URL, chave, última versão) fica só neste browser: não vai nos dados partilhados.
const SYNC_LS=LS+":sync", SYNCQ_LS=LS+":syncq", SYNC_MS=15000;
const SYNC={cfg:null,last:0,q:{},err:"",at:null,pulling:false,pushing:false,busy:"",diag:{}};   // diag: tempos para o diagnóstico
try{ const c=JSON.parse(localStorage.getItem(SYNC_LS)||"null"); if(c&&c.url&&c.key){ SYNC.cfg={url:c.url,key:c.key}; SYNC.last=+c.last||0; } }catch(e){}
try{ const q=JSON.parse(localStorage.getItem(SYNCQ_LS)||"null"); if(q&&typeof q==="object") SYNC.q=q; }catch(e){}
const syncOn = () => !!(SYNC.cfg && MODE==="local");
const syncN = () => Object.keys(SYNC.q).length;
function syncSaveCfg(){ try{ if(SYNC.cfg) localStorage.setItem(SYNC_LS,JSON.stringify({...SYNC.cfg,last:SYNC.last})); else localStorage.removeItem(SYNC_LS); }catch(e){} }
function syncSaveQ(){ clearTimeout(SYNC.qs); SYNC.qs=null; try{ localStorage.setItem(SYNCQ_LS,JSON.stringify(SYNC.q)); }catch(e){} }
// resposta de um pull que não traz registos: endereço errado (o da monitorização) ou script antigo
const syncBadResp = d => new Error(d && Array.isArray(d.jogadores) ? "Esse endereço é o da monitorização. Usa o URL do script \"Estrela B — Dados da app\"." : "O script ainda não tem a versão nova (Implementar → Gerir implementações → Nova versão).");
const gImg = id => "https://drive.google.com/thumbnail?id="+encodeURIComponent(id)+"&sz=w1600";

// diferenças entre duas versões de um registo, até 2 níveis (ex.: ["att","p1"] = presença de um atleta):
// [[caminho, valor]] = mudou/novo, [[caminho]] = apagado, [[[], registo]] = registo inteiro
function syncDiff(a,b,path=[],out=[],depth=0){
  const isO=v=>v&&typeof v==="object"&&!Array.isArray(v);
  if(depth<2 && isO(a) && isO(b)){
    new Set([...Object.keys(a),...Object.keys(b)]).forEach(k=>{
      if(!(k in b)) out.push([path.concat(k)]);
      else if(!(k in a)) out.push([path.concat(k),b[k]]);
      else if(JSON.stringify(a[k])!==JSON.stringify(b[k])) syncDiff(a[k],b[k],path.concat(k),out,depth+1);
    });
    return out;
  }
  out.push([path,b]); return out;
}
// fila: registo novo ou apagado vai inteiro; registo alterado leva também a lista de mudanças (p), que o script
// aplica por cima do que lá estiver — duas pessoas a mexer em campos diferentes do mesmo treino não se apagam
function syncQ(c,i,d,prev){
  if(!syncOn()) return;
  const k=c+"/"+i, old=SYNC.q[k];
  if(d==null) SYNC.q[k]={c,i,d:null};
  else if(prev==null || (old && !old.p)) SYNC.q[k]={c,i,d};
  else { const p=syncDiff(prev,d); if(!p.length && !old) return; SYNC.q[k]={c,i,d,p:(old?old.p:[]).concat(p)}; }
  if(!SYNC.qs) SYNC.qs=setTimeout(syncSaveQ,300);
  clearTimeout(SYNC.pt); SYNC.pt=setTimeout(syncPush,700);
  syncBadge();
}
const syncErr = e => e&&e.name==="AbortError" ? "O Google demorou demasiado a responder."
  : (e&&e.message&&!/fetch|network|load/i.test(e.message) ? e.message : "Sem ligação ao Google.");

async function syncGet(params){
  const u=SYNC.cfg.url.trim()+(SYNC.cfg.url.includes("?")?"&":"?")+"k="+encodeURIComponent(SYNC.cfg.key)+"&"+Object.entries(params).map(([k,v])=>k+"="+encodeURIComponent(v)).join("&")+"&_="+Date.now().toString(36);   // evita respostas guardadas pelo browser
  const ctl=typeof AbortController!=="undefined"?new AbortController():null, tm=setTimeout(()=>ctl&&ctl.abort(),30000);
  try{
    let d;
    // sem "cache:no-store": com esse cabeçalho o Google responde 404 e obrigava a ir pelo caminho lento (JSONP)
    // se a leitura direta falhou 2 vezes seguidas, vai logo por JSONP (volta a tentar a direta de 10 em 10 min)
    const direct = (SYNC.fails||0)<2 || Date.now()-(SYNC.failAt||0)>600000;
    if(direct){
      try{ const r=await fetch(u,{signal:ctl?ctl.signal:undefined}); if(!r.ok) throw new Error("HTTP "+r.status); d=await r.json(); SYNC.fails=0; }
      catch(e){ if(e&&e.name==="AbortError") throw e; SYNC.fails=(SYNC.fails||0)+1; SYNC.failAt=Date.now();
        SYNC.diag.jsonp=(SYNC.diag.jsonp||0)+1; SYNC.diag.fetchErr=String(e&&e.message||e); }
    }
    if(d===undefined) d=await monJsonp(u);
    if(d&&d.erro) throw new Error(d.erro==="chave"?"A chave não está certa.":d.erro);
    return d;
  }finally{ clearTimeout(tm); }
}
async function syncPost(body){
  const ctl=typeof AbortController!=="undefined"?new AbortController():null, tm=setTimeout(()=>ctl&&ctl.abort(),60000);
  try{
    // text/plain: pedido "simples" (sem pré-verificação CORS), que o Apps Script aceita
    const r=await fetch(SYNC.cfg.url.trim(),{method:"POST",body:JSON.stringify({...body,k:SYNC.cfg.key}),signal:ctl?ctl.signal:undefined});
    if(!r.ok) throw new Error("HTTP "+r.status);
    const d=await r.json();
    if(d&&d.erro) throw new Error(d.erro==="chave"?"A chave não está certa.":d.erro==="pedido desconhecido"?"O script ainda não tem a versão nova (Implementar → Gerir implementações → Nova versão).":d.erro);
    return d;
  }finally{ clearTimeout(tm); }
}

// aplica registos vindos do servidor; os que têm alteração local por enviar ficam como estão
function syncApply(docs){
  let ch=0;
  (docs||[]).forEach(x=>{
    if(!x||!COLS.includes(x.c)||SYNC.q[x.c+"/"+x.i]) return;
    if(x.x){ if(x.i in D[x.c]){ delete D[x.c][x.i]; ch++; } return; }
    if(x.d&&typeof x.d==="object"&&JSON.stringify(D[x.c][x.i])!==JSON.stringify(x.d)){ D[x.c][x.i]=x.d; ch++; }
  });
  return ch;
}

async function syncPull(manual){
  if(!syncOn()||SYNC.pulling) return;
  SYNC.pulling=true; SYNC.manual=!!manual; syncBadge();
  try{
    const t0=Date.now(); const d=await syncGet({a:"pull",since:SYNC.last});
    SYNC.diag.pull={ms:Date.now()-t0,n:(d.docs||[]).length,at:Date.now()};
    if(!Array.isArray(d.docs)) throw syncBadResp(d);
    const ch=syncApply(d.docs);
    if(ch && d.docs.some(x=>x&&x.c==="staff")) dedupeStaff();   // repetidos vindos de outro dispositivo
    SYNC.last=Math.max(SYNC.last,+d.now||0); syncSaveCfg();
    if(ch){ lsSave(); VER++; schedule(); }
    SYNC.err=""; SYNC.at=Date.now();
    if(manual) toast(ch?`${ch} alteraç${ch===1?"ão":"ões"} recebida${ch===1?"":"s"}`:"Tudo atualizado");
  }catch(e){ SYNC.err=syncErr(e); if(manual) toast(SYNC.err); }
  finally{ SYNC.pulling=false; SYNC.manual=false; syncBadge(); }
}

async function syncPush(){
  if(!syncOn()||SYNC.pushing||!syncN()) return;
  SYNC.pushing=true; syncBadge();
  let again=false;
  try{
    const batch=[]; let size=0;
    for(const [k,op] of Object.entries(SYNC.q)){ const s=JSON.stringify(op).length; if(batch.length&&size+s>250000) break; batch.push([k,op]); size+=s; }
    const t0=Date.now(); const r=await syncPost({a:"push",ops:batch.map(([,o])=>o)});
    SYNC.diag.push={ms:Date.now()-t0,n:batch.length,kb:Math.round(size/1024),at:Date.now()};
    batch.forEach(([k,o])=>{ if(SYNC.q[k]===o) delete SYNC.q[k]; });   // se mudou entretanto, segue no próximo envio
    (r.erros||[]).forEach(x=>{ delete SYNC.q[x.c+"/"+x.i]; });
    if((r.erros||[]).length) toast(`Não foi possível partilhar ${r.erros.length} registo(s): ${r.erros.some(x=>x.m==="grande")?"são grandes demais (fotos muito pesadas?).":"dados inválidos."}`);
    syncSaveQ(); SYNC.err=""; SYNC.at=Date.now(); again=syncN()>0;
  }catch(e){ SYNC.err=syncErr(e); SYNC.diag.pushErr={m:SYNC.err,at:Date.now()}; }
  finally{ SYNC.pushing=false; syncBadge(); }
  if(again) setTimeout(syncPush,50);
}

// fotos novas: para o Drive (os outros dispositivos veem-nas); devolve o id do ficheiro ou null
async function syncImg(blob){
  if(!syncOn()) return null;
  try{
    const data=await new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(String(fr.result).split(",")[1]||""); fr.onerror=()=>rej(fr.error); fr.readAsDataURL(blob); });
    const r=await syncPost({a:"img",data,type:blob.type||"image/jpeg"});
    return r&&r.id ? String(r.id) : null;
  }catch(e){ toast("A foto não foi para o Drive ("+syncErr(e)+"). Fica só neste dispositivo."); return null; }
}
// fotos que só estavam neste browser (IndexedDB ou dentro do registo) passam para o Drive
async function syncMoveImgs(){
  let n=0;
  for(const c of ["exercises","opponents"]) for(const [id,x] of Object.entries(D[c])){
    let blob=null;
    try{
      if(x.imgL && IMGC[x.imgL]) blob=await (await fetch(IMGC[x.imgL])).blob();
      else if(c==="exercises" && typeof x.img==="string" && x.img.startsWith("data:")) blob=await (await fetch(x.img)).blob();
    }catch(e){ blob=null; }
    if(!blob) continue;
    const g=await syncImg(blob); if(!g) continue;
    const o=clone(D[c][id]); if(!o) continue;
    delete o.imgL; delete o.img; o.imgG=g; put(c,id,o); n++;
  }
  return n;
}

// primeira ligação: junta os dados deste dispositivo com os do servidor (o servidor ganha nos registos que existem
// nos dois, exceto se aqui houver uma foto que lá não há); o que só existe aqui é enviado
async function syncConnect(url,key){
  const prev={cfg:SYNC.cfg,last:SYNC.last};
  SYNC.cfg={url:url.trim(),key:key.trim()}; SYNC.last=0;
  let d;
  try{ d=await syncGet({a:"pull",since:0}); if(!Array.isArray(d.docs)) throw syncBadResp(d); }
  catch(e){ SYNC.cfg=prev.cfg; SYNC.last=prev.last; throw new Error(syncErr(e)); }
  const srv={}; d.docs.forEach(x=>{ if(x&&COLS.includes(x.c)) srv[x.c+"/"+x.i]=x; });
  const hasOwnImg = o => o && (o.imgL || o.imgG || o.imgA || (typeof o.img==="string" && o.img.startsWith("data:")));
  let got=0, sent=0;
  Object.values(srv).forEach(x=>{
    const loc=D[x.c][x.i];
    if(x.x){ if(loc){ delete D[x.c][x.i]; got++; } return; }
    if(hasOwnImg(loc) && !hasOwnImg(x.d)) return;           // fica a versão daqui (com foto), que será enviada
    if(JSON.stringify(loc)!==JSON.stringify(x.d)){ D[x.c][x.i]=x.d; got++; }
  });
  COLS.forEach(c=>Object.entries(D[c]).forEach(([i,doc])=>{ const k=c+"/"+i, s=srv[k];
    if(!s || (hasOwnImg(doc) && !s.x && !hasOwnImg(s.d))){ SYNC.q[k]={c,i,d:doc}; sent++; } }));
  SYNC.last=+d.now||0; SYNC.err=""; SYNC.at=Date.now();
  syncSaveCfg(); syncSaveQ(); lsSave(); VER++; schedule();
  const dup=dedupeStaff();
  await syncMoveImgs();
  await syncPush();
  return {got,sent,server:d.docs.length,dup};
}
// staff repetido (mesmo nome, ids diferentes — p. ex. criado à mão num dispositivo e vindo dos dados iniciais noutro):
// fica um só (o que tem foto; depois o mais completo; depois o id menor), com os campos vazios preenchidos pelo outro,
// e as presenças do staff nos treinos passam para o que fica. Devolve quantos foram juntos.
function dedupeStaff(){ NOSTAMP++; try{ return dedupeStaffRun(); } finally{ NOSTAMP--; } }   // automático: não muda o "quem alterou"
function dedupeStaffRun(){
  const groups={};
  Object.entries(D.staff).forEach(([id,s])=>{ const k=nameKey(s&&s.name); if(k) (groups[k]=groups[k]||[]).push(id); });
  const score=id=>{ const s=D.staff[id]; return (s.photo||s.photoData?100:0)+Object.values(s).filter(v=>v!=null&&v!=="").length; };
  const map={}; let n=0;
  Object.values(groups).forEach(ids=>{ if(ids.length<2) return;
    ids.sort((a,b)=>score(b)-score(a)||(a<b?-1:1));
    const keep=ids[0], o=clone(D.staff[keep]);
    ids.slice(1).forEach(id=>{ Object.entries(D.staff[id]).forEach(([f,v])=>{ if((o[f]==null||o[f]==="")&&v!=null&&v!=="") o[f]=v; }); map[id]=keep; });
    put("staff",keep,o); ids.slice(1).forEach(id=>{ del("staff",id); n++; });
  });
  if(n) Object.entries(D.events).forEach(([eid,e])=>{ const sa=e&&e.satt; if(!sa||!Object.keys(sa).some(k=>map[k])) return;
    const x=clone(e); Object.entries(sa).forEach(([k,v])=>{ if(map[k]){ if(!x.satt[map[k]]||!x.satt[map[k]].s) x.satt[map[k]]=v; delete x.satt[k]; } }); put("events",eid,x); });
  return n;
}
function syncDisconnect(){ SYNC.cfg=null; SYNC.last=0; SYNC.q={}; SYNC.err=""; syncSaveCfg(); syncSaveQ(); syncBadge(); }

/* estado no cabeçalho */
function syncBadge(){
  const el=document.getElementById("syncSt"); if(!el) return;
  if(!syncOn()){ el.hidden=true; return; }
  const n=syncN(), busy=SYNC.pushing||(SYNC.pulling&&SYNC.manual);   // consultas automáticas em silêncio
  const t = SYNC.err ? `Sem ligação${n?` · ${n} por enviar`:""}` : busy ? "A sincronizar…" : n ? `${n} por enviar` : "Partilhado";
  el.hidden=false; el.className="syncst "+(SYNC.err?"err":busy||n?"busy":"ok"); el.textContent=t;
  el.title = SYNC.err ? SYNC.err : SYNC.at ? "Última sincronização: "+new Date(SYNC.at).toLocaleTimeString("pt-PT") : "";
}
function syncStart(){
  syncBadge();
  if(!syncOn()) return;
  syncPush(); syncPull();
  if(SYNC.iv) return;
  SYNC.iv=setInterval(()=>{ if(document.visibilityState!=="hidden"){ syncPush(); syncPull(); } }, SYNC_MS);
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"){ syncPush(); syncPull(); } else if(SYNC.qs) syncSaveQ(); });
  window.addEventListener("online",()=>{ syncPush(); syncPull(); });
  window.addEventListener("pagehide",()=>{ if(SYNC.qs) syncSaveQ(); });
}

/* diagnóstico (tempos reais dos pedidos ao Google) */
function syncDiagHTML(){
  const g=SYNC.diag, s=ms=>ms==null?"—":(ms/1000).toFixed(1).replace(".",",")+" s", h=t=>t?new Date(t).toLocaleTimeString("pt-PT"):"";
  const row=(l,v)=>`<div style="display:flex;justify-content:space-between;gap:10px"><span class="muted">${l}</span><b>${v}</b></div>`;
  return `<div class="small" id="syncDiag" style="margin:0 0 12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;display:grid;gap:4px">
    <b style="margin-bottom:2px">Diagnóstico</b>
    ${row("Último envio", g.push?`${s(g.push.ms)} — ${g.push.n} registo(s), ${g.push.kb} KB às ${h(g.push.at)}`:"—")}
    ${row("Última receção", g.pull?`${s(g.pull.ms)} — ${g.pull.n} registo(s) às ${h(g.pull.at)}`:"—")}
    ${row("Teste de ligação", g.ping?`${s(g.ping.ms)}${g.ping.err?" — "+esc(g.ping.err):""}`:"—")}
    ${row("Por enviar", syncN())}
    ${g.jsonp?row("Leitura direta bloqueada", `${g.jsonp}× (${esc(g.fetchErr||"")})`):""}
    ${g.pushErr?row("Último erro ao enviar", `${esc(g.pushErr.m)} às ${h(g.pushErr.at)}`):""}
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px"><button class="btn sm" data-a="syncPing">Testar ligação</button><button class="btn sm" data-a="syncTrash">Recuperar apagados</button></div></div>`;
}
async function syncPing(){
  if(!syncOn()) return;
  const t0=Date.now(); let err="";
  try{ await syncGet({a:"pull",since:Number.MAX_SAFE_INTEGER}); }catch(e){ err=syncErr(e); }
  SYNC.diag.ping={ms:Date.now()-t0,err};
  const el=document.getElementById("syncDiag"); if(el) el.outerHTML=syncDiagHTML();
}

/* recuperar registos apagados (o script guarda o último conteúdo dos apagados nos últimos 60 dias) */
const COL_L = {events:"Treino/jogo",players:"Atleta",exercises:"Exercício",injuries:"Lesão",evals:"Avaliação",tests:"Testes físicos",scout:"Scouting",cycles:"Ciclo",principles:"Princípio",staff:"Staff",opponents:"Adversário",tactics:"Esquema tático",statdefs:"Estatística",meta:"Configuração"};
function lixoNome(x){
  const d=x.d||{};
  if(x.c==="events") return (d.type==="jogo"?`Jogo ${d.venue==="F"?"@":"vs"} ${d.opp||""}`:`Treino${d.theme?" — "+d.theme:""}`)+(d.date?" · "+fmtD(d.date,{day:"numeric",month:"short",year:"numeric"}):"");
  if(x.c==="injuries") return `${pname(d.pid)} · ${d.zone||d.type||""}${d.date?" · "+fmtD(d.date):""}`;
  return d.name||d.title||x.i;
}
async function syncLixo(){
  if(!syncOn()){ toast("Liga primeiro a partilha."); return; }
  toast("A procurar apagados…");
  let d; try{ d=await syncGet({a:"lixo"}); }catch(e){ toast(syncErr(e)); return; }
  if(!Array.isArray(d.docs)){ toast("O script ainda não tem a versão nova (Implementar → Gerir implementações → Nova versão)."); return; }
  const list=d.docs.filter(x=>COLS.includes(x.c) && !D[x.c][x.i] && x.c!=="meta");
  modal({title:"Recuperar apagados",sub:"Apagados nos últimos 60 dias por qualquer pessoa da equipa técnica",big:list.length>8,
    body: list.length ? `<div class="list">${list.map((x,j)=>`<div class="li" style="cursor:default"><span class="main"><b>${esc(lixoNome(x))}</b><small>${esc(COL_L[x.c]||x.c)} · apagado ${new Date(x.t).toLocaleString("pt-PT",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}</small></span><button class="btn sm primary" data-a="syncRestore" data-j="${j}">Recuperar</button></div>`).join("")}</div>`
      : `<div class="empty"><b>Nada para recuperar</b>Não há registos apagados nos últimos 60 dias.</div>`,
    foot:`<span></span><span class="right"><button class="btn" data-a="mClose">Fechar</button></span>`, ctx:{lixo:list}});
}
function syncRestore(j){
  const x=M&&M.lixo&&M.lixo[j]; if(!x) return;
  if(D[x.c][x.i]){ toast("Já existe."); return; }
  put(x.c,x.i,x.d); M.lixo[j]=null;
  const b=document.querySelector(`#dlg [data-a="syncRestore"][data-j="${j}"]`); if(b){ b.disabled=true; b.textContent="Recuperado"; }
  toast(`${COL_L[x.c]||"Registo"} recuperado`);
}

/* janela de ligação */
function syncForm(){
  const c=SYNC.cfg||{};
  const on=syncOn();
  modal({title:"Partilhar dados com a equipa técnica",sub:"Google Sheets através do script \"Estrela B — Dados da app\"",
    body:`${on?syncDiagHTML():""}${on?`<p class="small" style="margin:0 0 12px"><b>Ligado.</b> ${SYNC.err?`<span style="color:var(--r5)">${esc(SYNC.err)}</span>`:SYNC.at?"Última sincronização às "+new Date(SYNC.at).toLocaleTimeString("pt-PT")+".":""}${syncN()?` ${syncN()} alteração(ões) por enviar.`:""}</p>`:""}
      <div class="form"><label class="fld full">Endereço (URL)<input name="url" value="${esc(c.url||"")}" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off"></label>
      <label class="fld full">Chave<input name="key" value="${esc(c.key||monCfg().key||"")}" autocomplete="off"></label></div>
      <p class="note">É o URL do script "Estrela B — Dados da app" (diferente do da monitorização) e a mesma chave. Cada pessoa da equipa técnica liga uma vez no seu dispositivo.
      Ao ligar, o que existe só aqui é enviado e o que já está partilhado passa para este dispositivo (nos registos que existem nos dois, fica o partilhado).
      As alterações dos outros aparecem em cerca de ${SYNC_MS/1000} segundos.</p>`,
    foot:`${on?`<button class="btn ghost" data-a="mDel">Desligar</button>`:"<span></span>"}<span class="right"><button class="btn" data-a="mClose">Cancelar</button><button class="btn primary" data-a="mSave">${on?"Guardar":"Ligar"}</button></span>`,
    ctx:{
      save:async()=>{ if(M.busy) return; const url=fv("url"), key=fv("key");
        if(!/^https:\/\//.test(url)){ toast("O endereço tem de começar por https://"); return; }
        if(!key){ toast("Falta a chave."); return; }
        if(on && url===c.url && key===c.key){ closeModal(); syncPush(); syncPull(true); return; }
        toast("A ligar e a juntar os dados…"); M.busy=true;
        try{ const r=await syncConnect(url,key); closeModal(); syncStart();
          toast(`Ligado. ${r.got} registo(s) recebido(s), ${r.sent} enviado(s).`); }
        catch(e){ if(M) M.busy=false; toast(e.message||"Não foi possível ligar."); }
      },
      del:()=>askConfirm("Desligar a partilha neste dispositivo? Os dados ficam aqui, mas deixas de receber e enviar alterações.","Desligar",true).then(ok=>{ if(ok){ syncDisconnect(); closeModal(); render(); toast("Partilha desligada neste dispositivo"); } })
    }});
}

/* ================= arranque ================= */
const use = n => EDITION==="clubes" ? sbUse(n) : (window.claude && typeof window.claude.use==="function") ? window.claude.use(n).catch(()=>null) : Promise.resolve(null);
document.getElementById("crest").src = CREST;
document.documentElement.style.setProperty("--wm", `url("${CREST}")`);   // emblema em marca d'água no cabeçalho
// ecrã de arranque: some sozinho por CSS (≤ 1,8 s); aqui só se retira do DOM no fim
(()=>{ const sp=document.getElementById("splash"); if(!sp) return; const rm=()=>{ if(sp.parentNode) sp.remove(); };
  sp.addEventListener("animationend",e=>{ if(e.animationName==="spOut") rm(); }); setTimeout(rm,2000); })();
/* tema: automático (segue o sistema), escuro ou claro — escolha guardada neste dispositivo */
const THEMES=[["auto","Tema automático (segue o sistema)"],["dark","Modo noite"],["light","Modo dia"]];
let THEME="auto"; try{ const t=localStorage.getItem(LS+":theme"); if(t==="dark"||t==="light") THEME=t; }catch(e){}
const THEME_ICO={
  auto:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>`,
  dark:`<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>`,
  light:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>`};
function applyTheme(){
  const r=document.documentElement; if(THEME==="auto") delete r.dataset.theme; else r.dataset.theme=THEME;
  const b=document.getElementById("themeBt"); if(b){ b.innerHTML=THEME_ICO[THEME]; const l=THEMES.find(t=>t[0]===THEME)[1]; b.title=l; b.setAttribute("aria-label",l+" — tocar para mudar"); }
}
applyTheme();
(()=>{ const l=document.createElement("link"); l.rel="apple-touch-icon"; l.href=CREST; document.head.appendChild(l); })();
render();
(async()=>{
  db = await use("db");
  assets = await use("assets");
  if(!db){ await idbLoadAll(); lsLoad(); MODE="local"; runMigrations(); render(); monAuto(); syncStart(); return; }
  const got={}, ok={};
  // as atualizações de dados só correm se todas as coleções chegaram bem (nunca sobre dados incompletos)
  const ready=()=>{ if(MODE==="loading" && COLS.every(c=>got[c])){ MODE="db"; if(COLS.every(c=>ok[c])) runMigrations(); monAuto(); } schedule(); };
  COLS.forEach(c=>{
    db.collection(c).onSnapshot(q=>{
      const next={};
      q.docs.forEach(d=>{ const key=c+"/"+d.id; next[d.id] = busy(key) && D[c][d.id] ? D[c][d.id] : d.data(); });
      Object.keys(D[c]).forEach(id=>{ if(busy(c+"/"+id) && !(id in next) && pending[c+"/"+id] && !pending[c+"/"+id].del) next[id]=D[c][id]; });
      D[c]=next; VER++; got[c]=true; ok[c]=true; ready();
    }, ()=>{ got[c]=true; ready(); });
  });
  setTimeout(()=>{ if(MODE==="loading"){ COLS.forEach(c=>got[c]=true); ready(); } }, 12000);
})();

})();
</script>
