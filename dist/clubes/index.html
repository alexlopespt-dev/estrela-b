/* ================= modo pós-jogo ================= */
const RATES = [4,4.5,5,5.5,6,6.5,7,7.5,8,8.5,9,9.5,10];
let Q = null;
function openQuick(gid){
  const g=D.events[gid]; if(!g||g.type!=="jogo") return;
  const c=gameCalc(g), sel={}, draft={};
  players().forEach(p=>{
    const x=c.res[p.id], st=(g.xi||[]).includes(p.id);
    if(st) sel[p.id]="T"; else if(x&&x.min>0) sel[p.id]="S";
    draft[p.id]={r:parseNum((g.rt||{})[p.id]), min:x&&x.min?x.min:(st?90:""), g:x?x.g:0, a:x?x.a:0, y:x?x.y:0, rc:x?x.r:0};
  });
  Q={gid,step:"sel",sel,draft,idx:0};
  drawQuick();
}
const qList = () => players().filter(p=>Q.sel[p.id]).sort((a,b)=>(Q.sel[a.id]==="T"?0:1)-(Q.sel[b.id]==="T"?0:1)||BYPOS(a,b));
function qDraft(pid){ const d=Q.draft[pid]||(Q.draft[pid]={r:null,min:"",g:0,a:0,y:0,rc:0}); return d; }
function qRead(){
  if(!Q||Q.step!=="p") return; const p=qList()[Q.idx]; if(!p) return; const d=qDraft(p.id);
  const r=$("#qRate"); if(r){ const v=parseNum(r.value); d.r = v==null?null:Math.max(0,Math.min(10,Math.round(v*10)/10)); }
  const m=$("#qMin"); if(m){ const v=parseNum(m.value); d.min = v==null?"":Math.max(0,Math.round(v)); }
}
function quickEvents(d){
  let h="";
  const rep=(n,ic)=>{ if(!n) return; h+=ic+(n>1?`<span class="xn">×${n}</span>`:""); };
  rep(d.g,I_BALL); rep(d.a,I_AST);
  if(d.y) h+=`<span class="card-y"></span>`+(d.y>1?`<span class="card-y"></span>`:"");
  if(d.rc) h+=`<span class="card-r"></span>`;
  return h;
}
function drawQuick(){
  const g=D.events[Q.gid]||{}, dl=$("#dlg");
  const opp=g.opp?`${g.venue==="F"?"@ ":"vs "}${esc(g.opp)}`:"jogo";
  const X=`<button class="x" data-a="qExit" aria-label="Sair">✕</button>`;
  const head=(t,s)=>`<div class="dlg-h"><img class="crest-sm" src="${CREST}" alt="" style="width:34px;flex:none"><div style="flex:1;min-width:0"><h3>${t}</h3><p>${s}</p></div>${X}</div>`;
  let body="";
  if(Q.step==="sel"){
    const tiles=k=>players().filter(p=>GROUP(p.pos)===k).map(p=>{ const s=Q.sel[p.id]||"", av=avail(p.id);
      return `<button class="tile ${s==="T"?"xi":s==="S"?"on":"off"}" data-a="qSel" data-p="${esc(p.id)}">${av!=="ok"?`<span class="flag ${av==="cond"?"cond":""}"></span>`:""}${avatar(p)}<b>${esc(p.name)}</b><span class="st">${s==="T"?"Titular":s==="S"?"Suplente":"Não jogou"}</span></button>`; }).join("");
    const nT=Object.values(Q.sel).filter(x=>x==="T").length, nS=Object.values(Q.sel).filter(x=>x==="S").length;
    body=head(`Pós-jogo — ${opp}`,"Passo 1 de 3 — quem jogou? Toca uma vez para titular, outra para suplente, outra para limpar.")+
      `<div class="dlg-b">${["GR","DEF","MED","ATA","X"].map(k=>{ const t=tiles(k); return t?`<div class="gsec">${GNAME[k]}</div><div class="tiles">${t}</div>`:""; }).join("")}</div>
      <div class="dlg-f"><button class="btn ghost" data-a="qExit">Sair</button><span class="right"><span class="small muted" style="align-self:center"><b>${nT}</b> titulares — <b>${nS}</b> suplentes</span><button class="btn primary" data-a="qStart" ${nT+nS?"":"disabled"}>Dar notas</button></span></div>`;
  } else if(Q.step==="p"){
    const list=qList(), p=list[Q.idx], d=qDraft(p.id), st=Q.sel[p.id]==="T";
    const mins=st?[90,85,80,75,70,65,60,45]:[45,30,25,20,15,10,5];
    const step=(k,l,max)=>`<div class="stepper"><span>${l}</span><span class="ctl"><button data-a="qDec" data-k="${k}">−</button><output>${d[k]||0}</output><button data-a="qInc" data-k="${k}" data-max="${max}">+</button></span></div>`;
    body=`<div class="dlg-h">${avatar(p)}<div style="flex:1;min-width:0"><h3>${esc(p.name)}</h3><p>${esc(p.pos||"")} — ${Q.idx+1} de ${list.length}</p><div class="qprog"><i style="width:${(Q.idx+1)/list.length*100}%"></i></div></div>${X}</div>
      <div class="dlg-b">
        <div class="qlbl"><span>Nota</span><span class="fine"><button class="btn sm ghost" data-a="qFine" data-n="-0.1">−0.1</button><input id="qRate" inputmode="decimal" value="${d.r!=null?fmt1(d.r):""}" placeholder="–"><button class="btn sm ghost" data-a="qFine" data-n="0.1">+0.1</button></span></div>
        <div class="rates">${RATES.map(v=>`<button data-a="qRate" data-n="${v}" class="${d.r===v?"on "+rc(v):""}">${Number.isInteger(v)?v:v.toFixed(1)}</button>`).join("")}</div>
        <div class="seg" style="width:100%;margin-top:14px"><button data-a="qSt" data-k="T" class="${st?"on":""}" style="flex:1">Titular</button><button data-a="qSt" data-k="S" class="${st?"":"on"}" style="flex:1">Suplente</button></div>
        <div class="qlbl" style="margin-top:14px"><span>Minutos</span></div>
        <div class="mins">${mins.map(m=>`<button data-a="qMin" data-n="${m}" class="${+d.min===m?"on":""}">${m}'</button>`).join("")}<span class="small muted" style="align-self:center;margin-left:4px">ou</span><input id="qMin" inputmode="numeric" value="${esc(d.min??"")}" placeholder="min" aria-label="Outros minutos"></div>
        <div class="qstats">${step("g","Golos",9)}${step("a","Assistências",9)}${step("y","Amarelos",2)}${step("rc","Vermelho",1)}</div>
      </div>
      <div class="dlg-f"><button class="btn ghost" data-a="qPrev">${Q.idx?"Anterior":"Voltar à lista"}</button><span class="right"><button class="btn primary" data-a="qNext">${Q.idx<list.length-1?"Seguinte":"Rever jogo"}</button></span></div>`;
  } else {
    const list=qList(), miss=list.filter(p=>qDraft(p.id).r==null).length;
    const rows=list.map((p,i)=>{ const d=qDraft(p.id);
      return `<button class="li" data-a="qGo" data-i="${i}">${avatar(p)}<span class="main"><b>${esc(p.name)}</b><small><span class="pos">${esc(p.pos||"")}</span>${d.min?esc(d.min)+"'":""}${Q.sel[p.id]==="T"?"":" — suplente"}</small></span><span class="evq">${quickEvents(d)}</span>${badge(d.r)}</button>`; }).join("");
    body=head(`Rever — ${opp}`,"Passo 3 de 3 — toca num jogador para corrigir.")+
      `<div class="dlg-b" style="padding:0">${miss?`<p class="note" style="padding:12px 18px 0;color:var(--r6);font-weight:600">${miss} jogador${miss>1?"es":""} sem nota.</p>`:""}<div class="list">${rows}</div></div>
      <div class="dlg-f"><button class="btn ghost" data-a="qBack">Anterior</button><span class="right"><button class="btn gold" data-a="qSave">Guardar jogo</button></span></div>`;
  }
  dl.className="big"; dl.innerHTML=body;
  M={q:true,dirty:M&&M.q?M.dirty:false,save:quickSave};
  if(!dl.open) dl.showModal();
  const b=dl.querySelector(".dlg-b"); if(b) b.scrollTop=0;
}
function syncCount(ev,pid,t,n){
  const cur=ev.filter(e=>e.t===t&&e.pid===pid);
  if(cur.length===n) return ev;
  if(cur.length<n){ for(let i=cur.length;i<n;i++) ev.push({id:uid("e"),t,min:null,pid}); return ev; }
  const rm=cur.slice().sort((a,b)=>(parseNum(a.min)==null?0:1)-(parseNum(b.min)==null?0:1)).slice(0,cur.length-n).map(e=>e.id);
  return ev.filter(e=>!rm.includes(e.id) && !(e.t==="assist"&&rm.includes(e.of)));
}
function quickSave(){
  qRead();
  const g=clone(D.events[Q.gid]); if(!g){ closeModal(); Q=null; return; }
  const list=qList(), ids=list.map(p=>p.id);
  const call=new Set(g.call||[]); ids.forEach(id=>call.add(id));
  g.call=[...call]; g.xi=ids.filter(id=>Q.sel[id]==="T");
  g.rt=g.rt||{}; g.minOv=g.minOv||{}; let ev=(g.ev||[]).slice();
  players().forEach(p=>{
    const pid=p.id, on=!!Q.sel[pid], d=qDraft(pid);
    if(!on){ delete g.minOv[pid]; return; }
    if(d.r!=null) g.rt[pid]=d.r; else delete g.rt[pid];
    if(d.min!==""&&d.min!=null) g.minOv[pid]=+d.min; else delete g.minOv[pid];
    ev=syncCount(ev,pid,"golo",+d.g||0); ev=syncCount(ev,pid,"assist",+d.a||0);
    ev=syncCount(ev,pid,"amarelo",+d.y||0); ev=syncCount(ev,pid,"vermelho",+d.rc||0);
  });
  g.ev=ev; put("events",Q.gid,g); closeModal(); Q=null; toast("Jogo guardado");
}
function quickExit(){
  if(!M||!M.dirty){ closeModal(); Q=null; return; }
  askConfirm("Sair sem guardar? As notas que lançaste agora perdem-se.","Sair sem guardar",true).then(ok=>{ if(ok){ closeModal(); Q=null; } });
}

/* ================= grelha da época ================= */
function vGrid(){
  const t=todayISO(), gs=games().filter(g=>g.date<=t||(g.call||[]).length);
  if(!gs.length) return `<div class="empty"><b>Ainda não há jogos</b>A grelha mostra a nota de cada atleta em cada jornada.</div>`;
  const calcs={}; gs.forEach(g=>calcs[g.id]=gameCalc(g));
  const best={}; gs.forEach(g=>{ const rs=Object.entries(g.rt||{}).map(([pid,r])=>[pid,parseNum(r)]).filter(([,r])=>r!=null);
    const mx=rs.length?Math.max(...rs.map(x=>x[1])):null; best[g.id]=rs.filter(x=>x[1]===mx).map(x=>x[0]); });
  const st=stats();
  const rows=players().map(p=>({p,s:st.pl[p.id]})).sort((a,b)=>(b.s.avg??-1)-(a.s.avg??-1)||b.s.min-a.s.min);
  const label=g=>{ const m=String(g.phase||"").match(/(\d+)/); return m?"J"+m[1]:fmtD(g.date,{day:"2-digit",month:"2-digit"}); };
  return `<section class="card"><div class="tscroll"><table class="tb"><thead><tr><th class="l stk">Atleta</th>
    ${gs.map(g=>`<th><button class="lnk" data-a="page" data-p="jogo" data-id="${esc(g.id)}" title="${esc((g.opp||"")+" — "+fmtD(g.date))}">${esc(label(g))}</button></th>`).join("")}
    <th>J</th><th>Min</th><th>G</th><th>A</th><th class="stkr">Média</th></tr></thead><tbody>
    ${rows.map(({p,s},i)=>`<tr><td class="l stk"><button class="lnk pin" data-a="page" data-p="atleta" data-id="${esc(p.id)}"><span class="rank">${i+1}</span>${avatar(p)}<b>${esc(p.name)}</b></button></td>
      ${gs.map(g=>{ const r=parseNum((g.rt||{})[p.id]); const x=calcs[g.id].res[p.id];
        return `<td>${r!=null?`<button class="lnk" data-a="page" data-p="jogo" data-id="${esc(g.id)}"><span class="rt ${rc(r)} ${best[g.id].includes(p.id)?"best":""}" style="min-width:34px;height:22px;font-size:13px">${fmt1(r)}</span></button>`:`<span class="muted">${x&&(x.st||x.min>0)?"·":""}</span>`}</td>`; }).join("")}
      <td class="num">${s.j}</td><td class="num">${s.min}</td><td class="num">${s.g||"–"}</td><td class="num">${s.a||"–"}</td><td class="stkr">${badge(s.avg)}</td></tr>`).join("")}
    </tbody></table></div></section>
    <p class="note">Ordenado pela média da época. A estrela marca a melhor nota de cada jogo. Toca numa nota para abrir a ficha de jogo.</p>`;
}

/* ================= importar da app de ratings ================= */
async function importRatings(d){
  const map={}, byName={};
  allPlayers().forEach(p=>byName[String(p.name).trim().toLowerCase()]=p.id);
  let novos=0;
  (d.players||[]).forEach(rp=>{
    const key=String(rp.name||"").trim().toLowerCase();
    if(D.players[rp.id]) map[rp.id]=rp.id;
    else if(byName[key]) map[rp.id]=byName[key];
    else { const nid=uid("p_"); const o={n:parseNum(rp.n),name:rp.name||"Sem nome",pos:rp.pos||"MC",photo:null};
      const ph=(d.photos||{})[rp.id]; if(ph) o.photoData=ph;
      put("players",nid,o); map[rp.id]=nid; novos++; }
  });
  const rounds=Object.entries(d.rounds||{}).filter(([,r])=>r && Object.keys(r.p||{}).length)
    .sort((a,b)=>(+a[0].replace(/\D/g,"")||0)-(+b[0].replace(/\D/g,"")||0));
  let criados=0, atualizados=0;
  rounds.forEach(([key,r])=>{
    const n=+key.replace(/\D/g,"")||0, phase=n?`Jornada ${n}`:"";
    let gid=games().find(g=>validISO(r.date)&&g.date===r.date)?.id
         || games().find(g=>phase&&String(g.phase)===phase&&(!r.comp||g.comp===r.comp))?.id;
    const base=gid?clone(D.events[gid]):{type:"jogo",dur:90,call:[],xi:[],ev:[],rt:{},minOv:{},ga:null,closed:false,notes:""};
    if(gid) atualizados++; else { gid=uid("jg_"); criados++; }
    base.date=validISO(r.date)?r.date:(base.date||todayISO());
    base.opp=r.opp||base.opp||""; base.comp=r.comp||base.comp||""; base.phase=base.phase||phase; base.venue=r.venue==="F"?"F":"C";
    if(r.ga!=null&&r.ga!=="") base.ga=+r.ga;
    base.call=base.call||[]; base.rt=base.rt||{}; base.minOv=base.minOv||{}; let ev=(base.ev||[]).slice();
    const call=new Set(base.call), xi=new Set(base.xi||[]);
    Object.entries(r.p||{}).forEach(([rpid,e])=>{
      const pid=map[rpid]; if(!pid) return;
      call.add(pid); if(e.st) xi.add(pid); else xi.delete(pid);
      if(e.r!=null) base.rt[pid]=e.r;
      if(e.min!=null&&e.min!=="") base.minOv[pid]=+e.min;
      ev=syncCount(ev,pid,"golo",+e.g||0); ev=syncCount(ev,pid,"assist",+e.a||0);
      ev=syncCount(ev,pid,"amarelo",+e.y||0); ev=syncCount(ev,pid,"vermelho",+e.rc||0);
    });
    base.call=[...call]; base.xi=[...xi]; base.ev=ev;
    put("events",gid,base);
  });
  if((d.team||d.season) && !meta().team) put("meta","team",{team:d.team||"",season:d.season||"",comp:""});
  toast(`Importado: ${criados} jogos novos, ${atualizados} atualizados${novos?`, ${novos} atletas novos`:""}.`);
}

const p2 = (a,b) => a&&b ? `<div class="p2"><div>${a}</div><div>${b}</div></div>` : (a||"")+(b||"");
// Tabela com muitas linhas: partida em duas tabelas lado a lado (metade das linhas em cada).
function pSplit(head, rows, min=12){
  if(rows.length<=min) return `<table><thead>${head}</thead><tbody>${rows.join("")}</tbody></table>`;
  const h=Math.ceil(rows.length/2), t=r=>`<table><thead>${head}</thead><tbody>${r.join("")}</tbody></table>`;
  return `<div class="p2"><div>${t(rows.slice(0,h))}</div><div>${t(rows.slice(h))}</div></div>`;
}

    {h:"Cart.",f:({x})=>(x.y?"A".repeat(x.y):"")+(x.r?" V":""),on:rows.some(r=>r.x.y||r.x.r)},
    {h:"Nota",f:({p})=>`<b>${nota(p)==null?"—":fmt1(nota(p))}</b>`,on:rows.some(r=>nota(r.p)!=null)},

  // eventos: golos, assistências e cartões resumidos por jogador; substituições em tabela
  const byT=t=>{ const n={}; evs.filter(e=>e.t===t).forEach(e=>{ const k=name(e); n[k]=(n[k]||0)+1; }); return Object.entries(n).map(([k,v])=>esc(k)+(v>1?` (${v})`:"")).join(", "); };

  const subs=evs.filter(e=>e.t==="sub");
  const eventos=resumo||subs.length?p2(resumo?`<h2>Resumo</h2>${resumo}`:"", subs.length?`<h2>Substituições</h2><table><thead><tr><th class="c">Min</th><th>Entra</th><th>Sai</th></tr></thead><tbody>${subs.map(e=>`<tr><td class="c">${parseNum(e.min)!=null?esc(parseNum(e.min))+"'":"—"}</td><td>${esc(pname(e.in))}</td><td>${esc(pname(e.out))}</td></tr>`).join("")}</tbody></table>`:""):"";
  const body=`${match}<div class="kv">${pRow("Data",cap1(fmtD(g.date,{weekday:"short",day:"2-digit",month:"2-digit",year:"numeric"})))}${pRow("Hora",g.time)}${pRow("Competição",g.comp)}${pRow("Jornada",g.phase)}${pRow("Local",g.venue==="F"?"Fora":"Casa")}</div>
    <h2>Ficha individual</h2>${ficha}
    ${eventos}
    ${g.notes?`<h2>Relatório</h2><p>${esc(g.notes).replace(/\n/g,"<br>")}</p>`:""}
    <div class="sign"><div>Treinador</div><div>Data</div></div>`;

/* ================= fotos ================= */
function thumb(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{ const s=240, c=document.createElement("canvas"); c.width=c.height=s; const x=c.getContext("2d");
      const m=Math.min(img.naturalWidth,img.naturalHeight), sx=(img.naturalWidth-m)/2, sy=Math.max(0,(img.naturalHeight-m)*0.2);
      x.drawImage(img,sx,sy,m,m,0,0,s,s); URL.revokeObjectURL(url); c.toBlob(b=>b?res(b):rej(new Error("blob")),"image/jpeg",0.85); };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error("img")); };
    img.src=url;
  });
}
const blobToData = b => new Promise(res=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.readAsDataURL(b); });
let photoTarget=null, exImgTarget=null;
function imgResize(file,maxW=560,q=0.62){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{ const w=Math.min(maxW,img.naturalWidth), h=Math.round(img.naturalHeight*w/img.naturalWidth);
      const c=document.createElement("canvas"); c.width=w; c.height=h; c.getContext("2d").drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg",q)); };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error("img")); };
    img.src=url;
  });
}
function imgBlob(file,maxW=1800,q=0.88){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{ const w=Math.min(maxW,img.naturalWidth), h=Math.round(img.naturalHeight*w/img.naturalWidth);
      const c=document.createElement("canvas"); c.width=w; c.height=h; const x=c.getContext("2d"); x.imageSmoothingQuality="high"; x.drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url); c.toBlob(b=>b?res(b):rej(new Error("blob")),"image/jpeg",q); };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error("img")); };
    img.src=url;
  });
}
/* Escolher ficheiros: o campo é criado no momento, dentro da janela aberta (se houver).
   Com uma janela modal aberta, o resto da página fica inerte e o Safari/iPhone (e o Claude)
   não abrem o seletor de um campo que esteja fora dela — era isso que impedia as fotos do staff. */
const FILE_H={}, FILE_ACCEPT={fileIn:"image/*",exImgIn:"image/*",jsonIn:"application/json,.json"};
const onFile=(id,fn)=>{ FILE_H[id]=fn; };
function pickFile(id){
  const host=[$("#dlgAsk"),$("#dlg")].find(d=>d&&d.open)||document.body;
  const inp=document.createElement("input"); inp.type="file"; inp.accept=FILE_ACCEPT[id]||"";
  inp.style.cssText="position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0";
  const done=()=>setTimeout(()=>inp.remove(),0), stop=e=>e.stopPropagation();
  inp.addEventListener("input",stop);
  inp.addEventListener("change",e=>{ stop(e); const fn=FILE_H[id]; if(fn) fn({target:inp}); done(); });
  inp.addEventListener("cancel",e=>{ stop(e); done(); });
  host.appendChild(inp); inp.click();
}
onFile("fileIn", async e=>{
  const f=e.target.files[0]; e.target.value=""; if(!f||!photoTarget) return;
  if(String(photoTarget).startsWith("staff:")){ const sid=photoTarget.slice(6); if(!D.staff[sid]) return;
    let blob; try{ blob=await thumb(f); }catch(err){ toast("Esse ficheiro não é uma imagem que o browser consiga abrir."); return; }
    const s=clone(D.staff[sid]);
    if(assets){ try{ const r=await assets.upload(blob,{type:"image/jpeg"}); s.photo=r.id; delete s.photoData; put("staff",sid,s); toast("Foto guardada"); closeModal(); return; }catch(err){} }
    s.photoData=await blobToData(blob); s.photo=null; put("staff",sid,s); toast("Foto guardada"); closeModal(); return; }
  if(String(photoTarget).startsWith("opp:")){ const oid=photoTarget.slice(4); if(!D.opponents[oid]) return;
    let blob; try{ blob=await imgBlob(f,256,0.9); }catch(err){ toast("Esse ficheiro não é uma imagem que o browser consiga abrir."); return; }
    const st=await saveImg(blob); const o=clone(D.opponents[oid]); if(!o) return; dropImg(o); delete o.imgA; delete o.imgL; delete o.imgG; delete o.crk;
    if(st) Object.assign(o,st); else o.crest=await blobToData(blob);
    put("opponents",oid,o); toast("Emblema guardado"); return; }
  if(!D.players[photoTarget]) return;
  let blob; try{ toast("A carregar a foto…"); blob=await thumb(f); }catch(err){ toast("Esse ficheiro não é uma imagem que o browser consiga abrir. Usa JPG ou PNG."); return; }
  const p=clone(D.players[photoTarget]);
  if(assets){ try{ const r=await assets.upload(blob,{type:"image/jpeg"}); p.photo=r.id; delete p.photoData; put("players",photoTarget,p); toast("Foto guardada"); return; }catch(err){ /* segue para guardar no documento */ } }
  p.photoData=await blobToData(blob); p.photo=null; put("players",photoTarget,p); toast("Foto guardada");
});

/* ================= cópias de segurança ================= */
async function exportData(){
  toast("A preparar a cópia…");
  const out={app:"estrela-tecnico",v:1,exported:new Date().toISOString()};
  COLS.forEach(c=>out[c]=clone(D[c]));
  for(const x of Object.values(out.exercises)){ if(x.imgA||x.imgL){ if(x.imgA) await blobUrl(x.imgA); const src=exImg(x); const data=src?await srcToData(src):null; if(data&&data.startsWith("data:")){ x.img=data; delete x.imgA; delete x.imgL; } } }
  for(const [id,p] of Object.entries(out.players)){ if(p.photo){ try{ const u=await blobUrl(p.photo); if(!u) continue; const r=await fetch(u); if(r.ok){ p.photoData=await blobToData(await r.blob()); p.photo=null; } }catch(e){} } }
  const data=JSON.stringify(out), fname=`${EDITION==="clubes"?slug(meta().full||meta().team||"equipa"):"estrela-tecnico"}-${todayISO()}.json`;
  const dl=await use("downloads");
  if(dl){ try{ await dl.save({filename:fname,data}); }catch(e){ if(!e||e.code!=="declined") toast("Não foi possível descarregar a cópia."); } return; }
  try{ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([data],{type:"application/json"})); a.download=fname; document.body.appendChild(a); a.click(); a.remove(); toast("Cópia descarregada"); }
  catch(e){ toast("Não foi possível descarregar a cópia."); }
}
async function importData(file){
  let d=null; try{ d=JSON.parse(await file.text()); }catch(e){ d=null; }
  if(!d || d.app!=="estrela-tecnico" || typeof d.players!=="object"){ toast("Esse ficheiro não é uma cópia desta app."); return; }
  if(!(await askConfirm(`Substituir todos os dados atuais pela cópia de ${d.exported?fmtD(d.exported.slice(0,10),{day:"numeric",month:"long",year:"numeric"}):"um ficheiro"}?`,"Substituir",true))) return;
  for(const x of Object.values(d.exercises&&typeof d.exercises==="object"?d.exercises:{})){
    if(x && typeof x.img==="string" && x.img.startsWith("data:") && x.img.length>120000){
      try{ const st=await saveImg(await (await fetch(x.img)).blob()); if(st){ delete x.img; Object.assign(x,st); } }catch(e){} } }
  for(const c of COLS){
    const next=d[c]&&typeof d[c]==="object"?d[c]:{};
    Object.keys(D[c]).forEach(id=>{ if(!(id in next)) del(c,id); });
    Object.entries(next).forEach(([id,o])=>put(c,id,o));
  }
  toast("Cópia importada");
}

  </div>`;
  modal({title:"Gerar semana-tipo",body,foot:footSave("Gerar semana"),ctx:{save:()=>{
    const mon=fv("mon"); if(!validISO(mon)){ toast("Escolhe a segunda-feira da semana."); return; }
    const monday=mondayOf(mon), evs=events(); let nT=0, nG=0;
    const dur=parseNum(fv("dur"))||90;
    for(let o=0;o<6;o++){ if(!fv("d"+o)) continue; const d=addDays(monday,o);
      if(evs.some(e=>e.type==="treino"&&e.date===d)) continue;
      put("events",uid("tr_"),{type:"treino",date:d,time:fv("time"),dur,place:fv("place"),ttype:fv("tt"+o),int:fv("in"+o),theme:"",plan:[],att:{},closed:false}); nT++; }
    if(fv("game")){ const d=addDays(monday,6);
      if(!evs.some(e=>e.type==="jogo"&&e.date===d)){ put("events",uid("jg_"),{type:"jogo",date:d,time:fv("gtime"),opp:fv("opp"),venue:fv("venue")||"C",comp:meta().comp||"",phase:fv("phase"),dur:90,call:[],xi:[],ev:[],rt:{},ga:null,closed:false}); nG++; } }
    let mc=false;
    if(!cycles("micro").some(c=>c.start<=addDays(monday,6)&&c.end>=monday)){ put("cycles",uid("cy_"),{kind:"micro",name:`Microciclo ${fmtD(monday)}`,start:monday,end:addDays(monday,6),obj:fv("obj"),notes:""}); mc=true; }
    closeModal(); S.day=monday; S.cal=monday.slice(0,7);
    toast(nT||nG||mc ? `Criado: ${[nT?nT+(nT>1?" treinos":" treino"):"",nG?"1 jogo":"",mc?"microciclo":""].filter(Boolean).join(", ")}.` : "Nada a criar: essa semana já tem os treinos e o jogo.");
  }}});
}

function evForm(gid){
  const g=D.events[gid]; if(!g) return;
  const call=(g.call||[]).map(P).filter(Boolean).sort(BYPOS);
  const opts=call.map(p=>({v:p.id,l:(p.n?p.n+" — ":"")+p.name}));
  const draw=()=>{
    const t=M.t;
    let f="";
    if(t==="golo") f=`<label class="fld">Marcador${sel("pid",[...opts,{v:"og",l:"Autogolo do adversário"}],"")}</label><label class="fld">Assistência${sel("ast",opts,"","", "Sem assistência")}</label>`;
    else if(t==="sub") f=`<label class="fld">Sai${sel("out",opts,"")}</label><label class="fld">Entra${sel("in",opts,"")}</label>`;
    else f=`<label class="fld">Jogador${sel("pid",opts,"")}</label>`;
    $("#evFields").innerHTML=`<label class="fld">Minuto${t==="sub"||t==="vermelho"?" (obrigatório)":""}<input name="min" inputmode="numeric" placeholder="Ex.: 63"></label>${f}`;
    $$("#dlg [data-a=evType]").forEach(b=>b.classList.toggle("on",b.dataset.k===t));
  };
  modal({title:"Novo evento",sub:esc((g.venue==="F"?"@ ":"vs ")+(g.opp||"")),
    body:`<div class="seg" style="margin-bottom:14px;flex-wrap:wrap">${[["golo","Golo"],["assist","Assistência"],["amarelo","Amarelo"],["vermelho","Vermelho"],["sub","Substituição"]].map(([k,l])=>`<button data-a="evType" data-k="${k}">${l}</button>`).join("")}</div><div class="form" id="evFields"></div>
      <p class="note">Os minutos jogados são calculados pelas substituições e expulsões (2 amarelos também contam como expulsão).</p>`,
    foot:footSave("Adicionar"),ctx:{t:"golo",draw,save:()=>{
      const t=M.t, min=parseNum(fv("min")), dur=+g.dur>0?+g.dur:90;
      if(min!=null && (min<0||min>dur+30)){ toast(`O minuto tem de estar entre 0 e ${dur+30}.`); return; }
      const ev=clone(g.ev||[]);
      if(t==="sub"){ const o=fv("out"), i=fv("in"); if(min==null){ toast("Indica o minuto da substituição."); return; } if(!o||!i){ toast("Escolhe quem sai e quem entra."); return; } if(o===i){ toast("Quem sai e quem entra têm de ser diferentes."); return; }
        const xi=new Set(g.xi||[]); if(xi.has(i)){ toast(`${pname(i)} é titular — não pode entrar como suplente.`); return; }
        if(ev.some(e=>e.t==="sub"&&e.in===i)){ toast(`${pname(i)} já entrou neste jogo.`); return; }
        if(ev.some(e=>e.t==="sub"&&e.out===o)){ toast(`${pname(o)} já foi substituído.`); return; }
        ev.push({id:uid("e"),t:"sub",min,out:o,in:i}); }
      else if(t==="golo"){ const pid=fv("pid"), ast=fv("ast"); if(!pid){ toast("Escolhe o marcador."); return; } if(ast&&ast===pid){ toast("O marcador não pode ser a assistência."); return; }
        const gid2=uid("e"); ev.push({id:gid2,t:"golo",min,pid:pid==="og"?"":pid}); if(ast) ev.push({id:uid("e"),t:"assist",min,pid:ast,of:gid2}); }
      else { const pid=fv("pid"); if(!pid){ toast("Escolhe o jogador."); return; } if(t==="vermelho"&&min==null){ toast("Indica o minuto da expulsão."); return; } ev.push({id:uid("e"),t,min,pid}); }
      put("events",gid,{...g,ev}); closeModal(); toast("Evento adicionado");
    }}});
  draw();
}

function tevList(id){ const tr=D.events[id]||{}; const att=tr.att||{}; return players().filter(p=>{ const a=att[p.id]; return a&&(a.s==="P"||a.s==="AT"); }); }
function tevRead(){
  if(!M||!M.tev) return; const l=tevList(M.gid), p=l[M.i]; if(!p) return;
  const tr=clone(D.events[M.gid]); if(!tr) return; tr.pev=tr.pev||{};
  const rEl=$("#tevR"), tEl=$("#tevT");
  const r=rEl?parseNum(rEl.value):null, t=tEl?tEl.value.trim():"";
  const cur={...(tr.pev[p.id]||{})};
  if(r==null) delete cur.r; else cur.r=Math.max(0,Math.min(10,Math.round(r*10)/10));
  if(t) cur.t=t; else delete cur.t;
  if(cur.r==null&&!cur.t) delete tr.pev[p.id]; else tr.pev[p.id]=cur;
  put("events",M.gid,tr);
}

const Cg = {
  cargaMc: el => { S.cargaMc=el.value; render(); },
  f: el => { const {col,id,f,t}=el.dataset; if(!D[col]||!D[col][id]) return; const o=clone(D[col][id]);
    let v = el.value; if(typeof v==="string") v=v.trim();
    if(t==="num"){ v=parseNum(v); if(v!=null && v<0){ toast("O valor não pode ser negativo."); schedule(); return; } }
    if(f==="date" && !validISO(v)){ toast("Data inválida."); schedule(); return; }
    if(f==="dur" && v!=null && (v<1||v>300)){ toast("A duração tem de estar entre 1 e 300 minutos."); schedule(); return; }
    o[f]=v; put(col,id,o); },
  meta: el => { const o=clone(D.meta.team||{}); o[el.dataset.f]=el.value.trim(); put("meta","team",o); },
  rpe: el => { const {id,p}=el.dataset; const tr=clone(D.events[id]); if(!tr) return; tr.att=tr.att||{}; const v=parseNum(el.value);
    if(v!=null && (v<1||v>10||!Number.isInteger(v))){ toast("O RPE é um número inteiro de 1 a 10."); schedule(); return; }
    tr.att[p]={...(tr.att[p]||{})}; if(v==null) delete tr.att[p].rpe; else tr.att[p].rpe=v; put("events",id,tr); },
  plan: el => { const {id,i,f}=el.dataset; const tr=clone(D.events[id]); const x=(tr.plan||[])[+i]; if(!x) return;
    if(f==="min"){ const v=parseNum(el.value); if(v!=null&&(v<0||v>300)){ toast("Minutos entre 0 e 300."); schedule(); return; } x.min=v; } else x[f]=el.value.trim();
    put("events",id,tr); },
  planAdd: el => { const exId=el.value; if(!exId) return; const id=el.dataset.id; const tr=clone(D.events[id]); const ex=D.exercises[exId]; if(!tr||!ex) return;
    tr.plan=tr.plan||[]; tr.plan.push({ex:exId,name:ex.name,min:ex.dur??null}); put("events",id,tr); toast(`${ex.name} adicionado`); },
  rt: el => { const {id,p}=el.dataset; const g=clone(D.events[id]); if(!g) return; g.rt=g.rt||{}; const v=parseNum(el.value);
    if(v!=null&&(v<0||v>10)){ toast("A nota tem de estar entre 0 e 10."); schedule(); return; }
    if(v==null) delete g.rt[p]; else g.rt[p]=Math.round(v*10)/10; put("events",id,g); },
  test: el => { const {m,p,k}=el.dataset; const t=clone(D.tests[m]); if(!t) return; t.res=t.res||{}; t.res[p]=t.res[p]||{}; const v=parseNum(el.value);
    if(v!=null && v<0){ toast("O valor não pode ser negativo."); schedule(); return; }
    if(el.value.trim()!=="" && v==null){ toast("Escreve só números, ex.: 4,52"); schedule(); return; }
    if(v==null) delete t.res[p][k]; else t.res[p][k]=v; if(!Object.keys(t.res[p]).length) delete t.res[p]; put("tests",m,t); },
  step: el => { const i=clone(D.injuries[el.dataset.id]); if(!i||!i.plan||!i.plan[+el.dataset.i]) return; i.plan[+el.dataset.i].done=el.checked; put("injuries",el.dataset.id,i); },
  stComp: el => { S.stComp=el.value; render(); },
  tev: el => { const {id,p,f}=el.dataset; const tr=clone(D.events[id]); if(!tr) return; tr.pev=tr.pev||{};
    const cur={...(tr.pev[p]||{})};
    if(f==="r"){ const v=parseNum(el.value); if(v!=null&&(v<0||v>10)){ toast("A nota tem de estar entre 0 e 10."); schedule(); return; } if(v==null) delete cur.r; else cur.r=Math.round(v*10)/10; }
    else { const t=el.value.trim(); if(t) cur.t=t; else delete cur.t; }
    if(cur.r==null&&!cur.t) delete tr.pev[p]; else tr.pev[p]=cur;
    put("events",id,tr); }
};

document.addEventListener("click", e=>{
  const el=e.target.closest("[data-a]"); if(!el) return;
  if(el.closest("#dlgAsk")) return;

function dvBind(){
  const svg=$("#dvS"); let act=null;
  const pt=e=>{ const p=svg.createSVGPoint(); p.x=e.clientX; p.y=e.clientY; const r=p.matrixTransform(svg.getScreenCTM().inverse());
    return {x:dvR(Math.max(0,Math.min(M.vec.w,r.x))),y:dvR(Math.max(0,Math.min(M.vec.h,r.y)))}; };

    if(T==="sel"){ if(M.sel!=null){ M.sel=null; dvRefresh(); } return; }

    if(T==="zone"){ dvSnap(); const k=dvK(); its.push({t:"rect",x:p.x,y:p.y,w:0,h:0,c:"#f2bd4b",fill:"#f2bd4b",fo:.18,lw:dvR(1.2*k),dash:`${dvR(5*k)} ${dvR(3*k)}`}); M.sel=its.length-1; act={mode:"zone",i:M.sel,x0:p.x,y0:p.y}; cap(e); dvRefresh(false); return; }

    if(act.mode==="drag"){ const dx=p.x-act.last.x, dy=p.y-act.last.y; act.last=p; if(dx||dy){ act.moved=true; dvMove(it,dx,dy); } }
    else if(act.mode==="line"){ it.pts[it.pts.length-1]=[p.x,p.y]; }
    else if(act.mode==="zone"){ it.x=Math.min(act.x0,p.x); it.y=Math.min(act.y0,p.y); it.w=dvR(Math.abs(p.x-act.x0)); it.h=dvR(Math.abs(p.y-act.y0)); }
    else if(act.mode==="h"){ if(act.h==="a") it.pts[0]=[p.x,p.y]; else if(act.h==="b") it.pts[it.pts.length-1]=[p.x,p.y];

}

  dvArr: el => { const it=M.vec.it[M.sel]; if(!it||it.t!=="ln") return; dvSnap(); const n=+el.dataset.s; if(n) it.arr=n; else delete it.arr; dvRefresh(); },

    ["r","s","fs","lw","amp","wl","sw"].forEach(k=>{ if(typeof it[k]==="number") it[k]=dvR(it[k]*f); });
    if(it.t==="rect"){ const cx=it.x+it.w/2, cy=it.y+it.h/2; it.w=dvR(it.w*f); it.h=dvR(it.h*f); it.x=dvR(cx-it.w/2); it.y=dvR(cy-it.h/2); }

  const it=M.vec.it[M.sel]; if(!it) return; it[el.dataset.dvf]=el.value; M.dirty=true; const s=$("#dvS"); if(s){ s.innerHTML=dvSVG(); dvSelDraw(); } });
document.addEventListener("keydown",e=>{ if(!M||!M.vec||!$("#dlg").open) return; const t=e.target;
  if(t&&/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
  const mod=e.ctrlKey||e.metaKey;
  if(mod&&e.key.toLowerCase()==="z"){ e.preventDefault(); e.shiftKey?A.dvRedo():A.dvUndo(); }
  else if(mod&&e.key.toLowerCase()==="y"){ e.preventDefault(); A.dvRedo(); }
  else if(mod&&e.key.toLowerCase()==="d"&&M.sel!=null){ e.preventDefault(); A.dvDup(); }
  else if((e.key==="Delete"||e.key==="Backspace")&&M.sel!=null){ e.preventDefault(); A.dvDel(); }
  else if(M.sel!=null&&e.key.startsWith("Arrow")){ e.preventDefault(); const it=M.vec.it[M.sel], s=(e.shiftKey?5:1)*dvK(); dvSnap();
    dvMove(it,e.key==="ArrowLeft"?-s:e.key==="ArrowRight"?s:0,e.key==="ArrowUp"?-s:e.key==="ArrowDown"?s:0); dvRefresh(false); }
});

function exFromCopy(srcId){
  const x=D.exercises[srcId]; if(!x) return null;
  const names=new Set(exercises().map(e=>e.name)); let nm=`${x.name} (cópia)`, i=2; while(names.has(nm)) nm=`${x.name} (cópia ${i++})`;
  const o=clone(x); o.name=nm; delete o._by; delete o._at; delete o.auto;

}

// O browser não tem acesso ao nome do computador ("MacBook Pro de Alexandre"): cada dispositivo identifica-se uma vez
// (pessoa + nome do dispositivo, guardado só neste browser) e cada put() feito aqui grava _by (esse nome) e _at (hora).
// O que chega de outros dispositivos (partilha/base de dados) já vem com o carimbo de quem o fez.

const ME_LS = LS+":eu";
function meGet(){ try{ return JSON.parse(localStorage.getItem(ME_LS)||"null")||{}; }catch(e){ return {}; } }
function devGuess(){
  const ua=navigator.userAgent||"", tp=navigator.maxTouchPoints||0;
  if(/iPad/.test(ua)||(/Macintosh/.test(ua)&&tp>1)) return "iPad";
  if(/iPhone/.test(ua)) return "iPhone";
  if(/Android/.test(ua)) return /Mobile/.test(ua)?"Telemóvel Android":"Tablet Android";
  if(/Macintosh|Mac OS/.test(ua)) return "Mac";
  if(/Windows/.test(ua)) return "PC Windows";
  return "Computador";
}
const firstName = n => String(n||"").trim().split(/\s+/)[0]||"";
// "MacBook Pro de Alexandre"; sem pessoa: só o dispositivo; nunca identificado: "Mac (sem nome)"
function meLabel(){ if(EDITION==="clubes") return sbName();   // versão com login: o nome da conta
  const m=meGet(), d=(m.disp||"").trim(), n=firstName(m.nome);
  return d&&n ? `${d} de ${n}` : d || (n ? `${devGuess()} de ${n}` : `${devGuess()} (sem nome)`); }
function stamp(obj){ obj._by=meLabel(); obj._at=new Date().toISOString(); }

function ago(iso){
  const t=new Date(iso); if(isNaN(t)) return "";
  const s=(Date.now()-t)/1000, hm=t.toLocaleTimeString("pt-PT",{hour:"2-digit",minute:"2-digit"}), day=isoOf(t);
  if(s<60) return "agora mesmo";
  if(s<3600) return `há ${Math.round(s/60)} min`;
  if(day===todayISO()) return `hoje, ${hm}`;
  if(day===addDays(todayISO(),-1)) return `ontem, ${hm}`;
  return `${t.toLocaleDateString("pt-PT",{day:"2-digit",month:"2-digit"})}, ${hm}`;
}

/* ---- elementos ---- */
const bpN = v => Math.round((+v||0)*10)/10;
function bpArrowPath(a){
  const x1=bpN(a.x1),y1=bpN(a.y1),x2=bpN(a.x2),y2=bpN(a.y2);
  const cx=a.cx==null?(x1+x2)/2:bpN(a.cx), cy=a.cy==null?(y1+y2)/2:bpN(a.cy);
  if(a.s!=="drib") return `M${x1} ${y1}Q${cx} ${cy} ${x2} ${y2}`;
  // condução: linha ondulada ao longo da curva (a última parte fica direita para a ponta da seta)
  const q=t=>({x:(1-t)*(1-t)*x1+2*(1-t)*t*cx+t*t*x2, y:(1-t)*(1-t)*y1+2*(1-t)*t*cy+t*t*y2});
  let len=0, prev=q(0); for(let i=1;i<=20;i++){ const p=q(i/20); len+=Math.hypot(p.x-prev.x,p.y-prev.y); prev=p; }
  const n=Math.max(8,Math.round(len/4)), waves=Math.max(1,Math.round(len/22)), out=[];
  for(let i=0;i<=n;i++){ const t=i/n, p=q(t), p2=q(Math.min(1,t+0.01)), p1=q(Math.max(0,t-0.01));
    let dx=p2.x-p1.x, dy=p2.y-p1.y; const d=Math.hypot(dx,dy)||1; dx/=d; dy/=d;
    const amp = t>0.86 ? 0 : 5*Math.sin(t*waves*2*Math.PI);
    out.push(`${Math.round((p.x-dy*amp)*10)/10} ${Math.round((p.y+dx*amp)*10)/10}`); }
  return "M"+out.join("L");
}
function bpLabel(x,y,txt,dy=24){
  if(!txt) return "";
  return `<text x="${x}" y="${y+dy}" text-anchor="middle" font-family="'Open Sans','Segoe UI',Arial,sans-serif" font-size="13.5" font-weight="700" fill="#06110a" filter="url(#bpHalo)">${esc(txt)}</text>`;
}
function bpItemSVG(it,o={}){
  const hit = o.hit ? `data-k="${esc(it.k)}" class="bpi"` : "", x=bpN(it.x), y=bpN(it.y);
  const sel = o.sel ? " bpsel" : "", op = o.op!=null && o.op<1 ? ` opacity="${Math.round(o.op*100)/100}"` : "";
  if(it.t==="p"){

    return `<g ${hit}${op}>${o.hit?`<circle cx="${x}" cy="${y}" r="22" fill="transparent"/>`:""}${o.sel?`<circle class="bpring" cx="${x}" cy="${y}" r="19"/>`:""}
      <circle cx="${x}" cy="${y}" r="13" fill="${c.f}" stroke="${c.s}" stroke-width="2.6" filter="url(#bpSh)"/>
      ${it.num!=null&&it.num!==""?`<text x="${x}" y="${y+4.3}" text-anchor="middle" font-family="'Open Sans',Arial,sans-serif" font-size="12" font-weight="800" fill="${it.c==="w"||it.c==="y"||!it.c?"#111":"#fff"}">${esc(it.num)}</text>`:""}
      ${bpLabel(x,y,it.n)}</g>`;

  if(it.t==="g"){

      <circle cx="${x}" cy="${y}" r="13" fill="url(#bpGr)" stroke="#0b0b0b" stroke-width="3.2" filter="url(#bpSh)"/>
      <text x="${x}" y="${y+4.4}" text-anchor="middle" font-family="'Open Sans',Arial,sans-serif" font-size="12.5" font-weight="800" fill="#0b150b">GR</text>${bpLabel(x,y,it.n)}</g>`;
  }
  if(it.t==="ball") return `<g ${hit}${op}>${o.hit?`<circle cx="${x}" cy="${y}" r="16" fill="transparent"/>`:""}${o.sel?`<circle class="bpring" cx="${x}" cy="${y}" r="11"/>`:""}
      <circle cx="${x}" cy="${y}" r="5.4" fill="#fff" stroke="#111" stroke-width="1.2"/><path d="M${x} ${y-2.1}l2 1.45-.76 2.35h-2.48l-.76-2.35z" fill="#111"/>
      <path d="M${x} ${y-2.1}V${y-5}M${x+2} ${y-.65}l2.9-.9M${x+1.24} ${y+1.7}l1.7 2.4M${x-1.24} ${y+1.7}l-1.7 2.4M${x-2} ${y-.65}l-2.9-.9" stroke="#111" stroke-width=".8"/></g>`;
  if(it.t==="cone") return `<g ${hit}${op}>${o.hit?`<circle cx="${x}" cy="${y}" r="16" fill="transparent"/>`:""}${o.sel?`<circle class="bpring" cx="${x}" cy="${y}" r="14"/>`:""}<path d="M${x} ${y-9}L${x+8} ${y+7}H${x-8}z" fill="#ff8a1f" stroke="#fff" stroke-width="1.4"/></g>`;
  if(it.t==="txt"){
    const col=BP_ZC[it.c]||"#fff";
    return `<g ${hit}${op}>${o.sel?`<rect class="bpring" x="${x-6}" y="${y-19}" width="${Math.max(30,String(it.s||"").length*9.5)+12}" height="26" rx="5"/>`:""}<text x="${x}" y="${y}" font-family="'Open Sans','Segoe UI',Arial,sans-serif" font-size="${it.fs||17}" font-weight="700" fill="${col}" filter="url(#bpTs)">${esc(it.s||"Texto")}</text></g>`;
  }
  if(it.t==="zone"){
    const col=BP_ZC[it.c]||BP_ZC.y, w=Math.abs(+it.w||0), h=Math.abs(+it.h||0), zx=Math.min(x,x+(+it.w||0)), zy=Math.min(y,y+(+it.h||0));
    const shape = it.sh==="e" ? `<ellipse cx="${bpN(zx+w/2)}" cy="${bpN(zy+h/2)}" rx="${bpN(w/2)}" ry="${bpN(h/2)}"` : `<rect x="${bpN(zx)}" y="${bpN(zy)}" width="${bpN(w)}" height="${bpN(h)}" rx="4"`;
    return `<g ${hit}${op}>${shape} fill="${col}" fill-opacity=".22" stroke="${col}" stroke-width="2" stroke-dasharray="8 6"/>${o.sel?`${shape} class="bpring" fill="none"/><circle class="bph" data-k="${esc(it.k)}" data-h="rs" cx="${bpN(zx+w)}" cy="${bpN(zy+h)}" r="9"/>`:""}</g>`;
  }
  if(it.t==="ar"){
    const s=BP_ARC[it.s]?it.s:"pass", col=it.c?(BP_ZC[it.c]||BP_ARC[s].c):BP_ARC[s].c, d=bpArrowPath(it);
    const dash = s==="run" ? ` stroke-dasharray="9 7"` : "";
    let hs="";
    if(o.sel){ const cx=it.cx==null?(it.x1+it.x2)/2:it.cx, cy=it.cy==null?(it.y1+it.y2)/2:it.cy, mx=bpN(0.25*it.x1+0.5*cx+0.25*it.x2), my=bpN(0.25*it.y1+0.5*cy+0.25*it.y2);
      hs=`<circle class="bph" data-k="${esc(it.k)}" data-h="p1" cx="${bpN(it.x1)}" cy="${bpN(it.y1)}" r="8"/><circle class="bph" data-k="${esc(it.k)}" data-h="p2" cx="${bpN(it.x2)}" cy="${bpN(it.y2)}" r="8"/><circle class="bph bphc" data-k="${esc(it.k)}" data-h="c" cx="${mx}" cy="${my}" r="8"/>`; }
    return `<g ${hit}${op}>${o.hit?`<path d="${bpArrowPath({...it,s:"pass"})}" fill="none" stroke="transparent" stroke-width="24"/>`:""}${o.sel?`<path class="bpring" d="${d}" fill="none"/>`:""}<path d="${d}" fill="none" stroke="${col}" stroke-width="${s==="drib"?2.4:2.8}" stroke-linecap="round" stroke-linejoin="round"${dash} marker-end="url(#bpAh${col.slice(1)})"/>${hs}</g>`;
  }
  return "";
}

/* ---- modelos por tipo ---- */
function bpTemplate(type){
  const P=(x,y,n="")=>({t:"p",x,y,n,c:"w"}), O=(x,y,n="")=>({t:"p",x,y,n,c:"r"}), G=(x,y)=>({t:"g",x,y}), B=(x,y)=>({t:"ball",x,y});
  const AR=(s,x1,y1,x2,y2,cx,cy)=>({t:"ar",s,x1,y1,x2,y2,cx:cx==null?(x1+x2)/2:cx,cy:cy==null?(y1+y2)/2:cy});
  let it=[];
  if(type==="lof") it=[G(500,79),P(296,335),P(361,334),P(421,334),P(474,334),P(530,334),P(892,356),P(248,411),P(858,508),B(814,502),P(388,637),P(621,637)];
  else if(type==="ldf"){
    const bx=640, by=545, dx=500-bx, dy=55-by, d=Math.hypot(dx,dy), ux=dx/d, uy=dy/d, wx=bx+151*ux, wy=by+151*uy;
    it=[G(500,79),B(bx,by),O(bx+14,by+26)];
    [-1.5,-0.5,0.5,1.5].forEach(k=>it.push(P(Math.round(wx-uy*27*k),Math.round(wy+ux*27*k))));
    it.push(P(330,285),P(410,280),P(490,275),P(570,280),P(650,285),P(760,470));
    it.push(O(360,320),O(440,318),O(520,316),O(600,318),O(790,500));
  }
  else if(type==="cco") it=[G(500,79),B(938,60),P(956,44),P(872,112),AR("pass",938,60,878,108),
    P(425,215),P(500,190),P(578,212),P(650,262),P(560,350),P(420,352),P(380,610),P(620,610),
    O(468,112),O(540,118),O(440,188),O(528,160),O(612,178),O(846,148)];
  else if(type==="clo") it=[G(500,79),B(938,60),P(956,44),AR("pass",938,60,540,128,730,-20),
    P(420,300),P(480,318),P(560,308),P(625,290),AR("run",420,300,430,128),AR("run",480,318,505,160),AR("run",560,308,585,122),AR("run",625,290,560,225),
    P(500,392),P(650,380),P(380,610),P(620,610),O(445,100),O(505,108),O(565,100),O(470,170),O(540,168)];
  else if(type==="pen") it=[G(500,58),B(500,237),P(500,272),P(345,338),P(410,346),P(590,346),P(655,338),P(300,430),P(700,430),
    O(378,344),O(622,344),O(445,350),O(555,350)];
  else if(type==="lan") it=[B(947,404),P(963,420),P(880,356),P(884,478),P(820,420),P(740,330),AR("run",884,478,905,560),AR("pass",948,420,900,552,950,500),
    O(868,382),O(870,500),O(800,445),O(730,355)];
  return it.map((x,i)=>({k:"i"+(i+1),...x}));
}
// cópia de uma bola parada (ex.: o mesmo canto com outras setas): "Nome (cópia)", "Nome (cópia 2)"…
function bpCopyDoc(src){
  const o=clone(src), base=String(o.name||BPT(o.type).t).replace(/ \(cópia(?: \d+)?\)$/,""), names=new Set(setpieces().map(b=>b.name));
  let nm=base+" (cópia)", i=2; while(names.has(nm)) nm=base+` (cópia ${i++})`;

}

function bpCollect(){
  const b=clone(M.bp);
  b.name=String(($("#dlg [name=bpname]")||{}).value||"").trim()||BPT(b.type).t;
  b.type=($("#dlg [name=bptype]")||{}).value||b.type;
  b.tt=!!($("#dlg [name=bptt]")||{}).checked;
  b.notes=String(($("#dlg [name=bpnotes]")||{}).value||"").trim();
  return b;
}
const bpItems = () => M.bp.fr[M.fi].it;
const bpFind = k => bpItems().find(x=>x.k===k);
function bpSnap(){ M.hist.push(JSON.stringify({fr:M.bp.fr,fi:M.fi})); if(M.hist.length>80) M.hist.shift(); M.fut=[]; M.dirty=true; }
function bpNextK(){ let n=0; M.bp.fr.forEach(f=>f.it.forEach(x=>{ const m=/^i(\d+)$/.exec(x.k); if(m) n=Math.max(n,+m[1]); })); return "i"+(n+1); }
function bpRefresh(all){
  if(!M||!M.bp) return;
  const svg=$("#bpS"); if(!svg) return;
  $("#bpSI").innerHTML=bpItemsSVG(bpItems(),{hit:true,sel:M.selK});
  if(all){
    $("#bpST").innerHTML=bpTitle({name:($("#dlg [name=bpname]")||{}).value, tt:($("#dlg [name=bptt]")||{}).checked});
    $$("#dlg [data-a=bpTool]").forEach(x=>x.classList.toggle("on",x.dataset.k===M.tool));
    const n=M.bp.fr.length;
    $("#bpSteps").innerHTML=`<span class="small muted" style="font-weight:700">Passos</span>${M.bp.fr.map((f,i)=>`<button class="bpstep${i===M.fi?" on":""}" data-a="bpFrame" data-k="${i}">${i+1}</button>`).join("")}
      <button class="btn sm" data-a="bpFrameAdd" title="Novo passo a partir deste">+ Passo</button>${n>1?`<button class="btn sm ghost" data-a="bpFrameDel">Apagar passo ${M.fi+1}</button><button class="btn sm primary" data-a="bpPlay">${M.play?"■ Parar":"▶ Animar"}</button>`:`<small class="muted">Acrescenta passos para mostrar os movimentos e depois anima.</small>`}`;
    bpProps(); bpRoster();
    const hints={sel:"Arrasta para mover. Toca num elemento para o editar; nas setas, arrasta o ponto do meio para curvar.",del:"Toca num elemento para o apagar.",pass:"Arrasta no campo para desenhar o passe ou cruzamento.",run:"Arrasta para desenhar o movimento (sem bola).",drib:"Arrasta para desenhar a condução.",zone:"Arrasta no campo para marcar a zona.",txt:"Toca no campo para escrever um texto.",wall:"Toca no campo onde fica o centro da barreira."};
    const h=$("#bpHint"); if(h) h.textContent=hints[M.tool]||"Toca no campo para colocar. Arrasta um elemento para o mover.";
  }
}
function bpProps(){
  const el=$("#bpProps"); if(!el) return;
  const it=M.selK?bpFind(M.selK):null;
  if(!it){ el.innerHTML=`<div class="qlbl"><span>Elemento</span></div><p class="small muted" style="margin:0">Toca num jogador, seta, zona ou texto para o editar. Teclado: Delete apaga, Ctrl+Z desfaz, Ctrl+D duplica.</p>`; return; }
  const sw=(cols,cur,f)=>`<div class="bpsw">${Object.entries(cols).map(([k,v])=>`<button data-a="bpSet" data-f="${f}" data-v="${k}" class="${cur===k?"on":""}" title="${esc(v.l||k)}" style="background:${v.f||v}"></button>`).join("")}</div>`;
  const lbl={p:"Jogador",g:"Guarda-redes",ball:"Bola",cone:"Cone",txt:"Texto",zone:"Zona",ar:"Seta"}[it.t]||"Elemento";
  let h=`<div class="qlbl"><span>${lbl}</span></div>`;
  if(it.t==="p"||it.t==="g") h+=`<label class="fld full">Nome (por baixo)<input data-bpf="n" value="${esc(it.n||"")}" maxlength="24"></label>`;
  if(it.t==="p") h+=`<label class="fld full">Número (dentro do círculo)<input data-bpf="num" value="${esc(it.num||"")}" maxlength="3" inputmode="numeric"></label>${sw(BP_COL,it.c||"w","c")}`;
  if(it.t==="txt") h+=`<label class="fld full">Texto<input data-bpf="s" value="${esc(it.s||"")}" maxlength="60"></label>${sw(Object.fromEntries(Object.entries(BP_ZC).map(([k,v])=>[k,{f:v}])),it.c||"w","c")}`;
  if(it.t==="zone") h+=`<div class="seg" style="margin-bottom:8px"><button data-a="bpSet" data-f="sh" data-v="r" class="${it.sh!=="e"?"on":""}">Retângulo</button><button data-a="bpSet" data-f="sh" data-v="e" class="${it.sh==="e"?"on":""}">Elipse</button></div>${sw(Object.fromEntries(Object.entries(BP_ZC).map(([k,v])=>[k,{f:v}])),it.c||"y","c")}`;
  if(it.t==="ar") h+=`<div class="seg" style="margin-bottom:8px">${Object.entries(BP_ARC).map(([k,a])=>`<button data-a="bpSet" data-f="s" data-v="${k}" class="${it.s===k?"on":""}">${a.l}</button>`).join("")}</div><button class="btn sm" data-a="bpStraight">Endireitar</button>`;
  h+=`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px"><button class="btn sm" data-a="bpDup">Duplicar</button><button class="btn sm ghost" data-a="bpDelSel">Apagar</button></div>`;
  el.innerHTML=h;
}
function bpRoster(){
  const el=$("#bpRoster"); if(!el) return;
  const on=new Set(bpItems().filter(x=>x.pid).map(x=>x.pid)), names=new Set(bpItems().map(x=>x.n).filter(Boolean));
  const pl=players();
  el.innerHTML = pl.length ? pl.map(p=>`<button class="bprp${on.has(p.id)||names.has(p.name)?" on":""}" data-a="bpRoster" data-p="${esc(p.id)}"><i>${esc(p.n??"")}</i>${esc(p.name)}<small>${esc(p.pos||"")}</small></button>`).join("") : `<p class="small muted">Sem atletas no plantel.</p>`;
}
function bpBind(){
  const svg=$("#bpS"); let act=null;
  const pt=e=>{ const p=svg.createSVGPoint(); p.x=e.clientX; p.y=e.clientY; const r=p.matrixTransform(svg.getScreenCTM().inverse()); return {x:Math.max(0,Math.min(BW,r.x)),y:Math.max(0,Math.min(BH,r.y))}; };
  const cap=e=>{ try{ svg.setPointerCapture(e.pointerId); }catch(err){} };
  svg.addEventListener("pointerdown",e=>{
    if(!M||!M.bp||M.play) return; e.preventDefault();
    const p=pt(e), hEl=e.target.closest("[data-h]"), g=e.target.closest("[data-k]"), k=g?g.dataset.k:null, T=M.tool, its=bpItems();
    if(hEl){ const keep={fut:M.fut.slice(),dirty:M.dirty}; bpSnap(); act={mode:"h",k:hEl.dataset.k,h:hEl.dataset.h,moved:false,keep}; cap(e); return; }
    if(T==="del"){ if(k){ bpSnap(); M.bp.fr[M.fi].it=its.filter(x=>x.k!==k); if(M.selK===k) M.selK=null; bpRefresh(true); } return; }
    if(k && (T==="sel"||!["pass","run","drib","zone"].includes(T))){
      const was=M.selK, keep={fut:M.fut.slice(),dirty:M.dirty}; M.selK=k; bpSnap(); act={mode:"drag",k,last:p,moved:false,was,keep}; cap(e); bpRefresh(was!==k); return; }
    if(T==="sel"){ if(M.selK){ M.selK=null; bpRefresh(true); } return; }
    if(["pass","run","drib"].includes(T)){ bpSnap(); const o={k:bpNextK(),t:"ar",s:T,x1:p.x,y1:p.y,x2:p.x,y2:p.y}; its.push(o); M.selK=o.k; act={mode:"line",k:o.k}; cap(e); bpRefresh(); return; }
    if(T==="zone"){ bpSnap(); const o={k:bpNextK(),t:"zone",x:p.x,y:p.y,w:0,h:0,sh:"r",c:"y"}; its.push(o); M.selK=o.k; act={mode:"zone",k:o.k}; cap(e); bpRefresh(); return; }
    bpSnap();
    if(T==="wall"){ // barreira: 4 adversários virados para a baliza
      const ux=500-p.x, uy=55-p.y, d=Math.hypot(ux,uy)||1;
      [-1.5,-0.5,0.5,1.5].forEach(i=>its.push({k:bpNextK(),t:"p",x:Math.round(p.x-uy/d*27*i),y:Math.round(p.y+ux/d*27*i),n:"",c:"r"}));
      M.selK=null; bpRefresh(true); return; }
    const o={k:bpNextK(),x:Math.round(p.x),y:Math.round(p.y)};
    if(T==="p"||T==="o"){ o.t="p"; o.c=T==="o"?"r":"w"; o.n=""; }
    else if(T==="g") o.t="g";
    else if(T==="txt"){ o.t="txt"; o.s="Texto"; o.c="w"; }
    else o.t=T;
    its.push(o); M.selK=o.k; bpRefresh(true);
    if(T==="txt"){ const inp=$("#bpProps [data-bpf=s]"); if(inp){ inp.focus(); inp.select(); } }
  });
  svg.addEventListener("pointermove",e=>{
    if(!act||!M||!M.bp) return; const p=pt(e), it=bpFind(act.k); if(!it) return;
    if(act.mode==="drag"){ const dx=p.x-act.last.x, dy=p.y-act.last.y; act.last=p; if(Math.abs(dx)+Math.abs(dy)>0) act.moved=true;
      if(it.t==="ar"){ it.x1+=dx; it.y1+=dy; it.x2+=dx; it.y2+=dy; if(it.cx!=null){ it.cx+=dx; it.cy+=dy; } } else { it.x+=dx; it.y+=dy; } }
    else if(act.mode==="line"){ it.x2=p.x; it.y2=p.y; it.cx=(it.x1+it.x2)/2; it.cy=(it.y1+it.y2)/2; }
    else if(act.mode==="zone"){ it.w=p.x-it.x; it.h=p.y-it.y; }
    else if(act.mode==="h"){ act.moved=true;
      if(act.h==="p1"){ const ox=it.x1, oy=it.y1; it.x1=p.x; it.y1=p.y; if(it.cx!=null){ it.cx+=(p.x-ox)/2; it.cy+=(p.y-oy)/2; } }
      else if(act.h==="p2"){ const ox=it.x2, oy=it.y2; it.x2=p.x; it.y2=p.y; if(it.cx!=null){ it.cx+=(p.x-ox)/2; it.cy+=(p.y-oy)/2; } }
      else if(act.h==="c"){ it.cx=2*p.x-(it.x1+it.x2)/2; it.cy=2*p.y-(it.y1+it.y2)/2; }   // a curva passa pelo ponto arrastado
      else if(act.h==="rs"){ const zx=Math.min(it.x,it.x+it.w), zy=Math.min(it.y,it.y+it.h); it.x=zx; it.y=zy; it.w=Math.max(12,p.x-zx); it.h=Math.max(12,p.y-zy); } }
    bpRefresh();
  });
  const end=()=>{
    if(!act||!M||!M.bp){ act=null; return; } const it=bpFind(act.k), its=bpItems();
    if(it && act.mode==="line" && Math.hypot(it.x2-it.x1,it.y2-it.y1)<18){ M.bp.fr[M.fi].it=its.filter(x=>x!==it); M.selK=null; M.hist.pop(); }
    if(it && act.mode==="zone"){ if(Math.abs(it.w)<14||Math.abs(it.h)<14){ M.bp.fr[M.fi].it=its.filter(x=>x!==it); M.selK=null; M.hist.pop(); }
      else { if(it.w<0){ it.x+=it.w; it.w=-it.w; } if(it.h<0){ it.y+=it.h; it.h=-it.h; } } }
    if((act.mode==="drag"||act.mode==="h") && !act.moved){ M.hist.pop(); M.fut=act.keep.fut; M.dirty=act.keep.dirty; }
    if(it && act.mode==="drag"){ ["x","y","x1","y1","x2","y2","cx","cy"].forEach(f=>{ if(it[f]!=null) it[f]=Math.round(it[f]); }); }
    act=null; bpRefresh(true);
  };
  svg.addEventListener("pointerup",end); svg.addEventListener("pointercancel",end);
  svg.addEventListener("dblclick",e=>{ const g=e.target.closest("[data-k]"); if(!g) return; M.selK=g.dataset.k; bpRefresh(true); const inp=$("#bpProps [data-bpf]"); if(inp){ inp.focus(); inp.select(); } });
  const pr=$("#bpProps");
  pr.addEventListener("focusin",e=>{ if(e.target.dataset.bpf){ bpSnap(); } });
  pr.addEventListener("input",e=>{ const f=e.target.dataset.bpf; if(!f) return; const it=bpFind(M.selK); if(!it) return;
    const v=e.target.value; if(v==="" && f!=="s") delete it[f]; else it[f]=v; if(f==="n") delete it.pid; bpRefresh(); bpRoster(); });
  ["bpname","bptt"].forEach(n=>{ const el=$(`#dlg [name=${n}]`); if(el) el.addEventListener("input",()=>bpRefresh(true)); if(el) el.addEventListener("change",()=>bpRefresh(true)); });
  const ty=$("#dlg [name=bptype]"); if(ty) ty.addEventListener("change",()=>{ M.bp.type=ty.value; M.dirty=true; const s=$("#dlg .dlg-h p"); if(s) s.textContent=BPT(ty.value).l; });
}
function bpKey(e){
  if(!M||!M.bp) return;
  const tag=(e.target&&e.target.tagName)||"", typing=/INPUT|TEXTAREA|SELECT/.test(tag);
  const mod=e.ctrlKey||e.metaKey, k=e.key.toLowerCase();
  if(mod && k==="z" && !typing){ e.preventDefault(); e.shiftKey?A.bpRedo():A.bpUndo(); return; }
  if(mod && k==="y" && !typing){ e.preventDefault(); A.bpRedo(); return; }
  if(mod && k==="d" && !typing){ e.preventDefault(); A.bpDup(); return; }
  if((e.key==="Delete"||e.key==="Backspace") && !typing && M.selK){ e.preventDefault(); A.bpDelSel(); return; }
  if(!typing && M.selK && e.key.startsWith("Arrow")){ e.preventDefault(); const it=bpFind(M.selK); if(!it) return; const s=e.shiftKey?10:2, dx=e.key==="ArrowLeft"?-s:e.key==="ArrowRight"?s:0, dy=e.key==="ArrowUp"?-s:e.key==="ArrowDown"?s:0;
    bpSnap(); if(it.t==="ar"){ it.x1+=dx; it.y1+=dy; it.x2+=dx; it.y2+=dy; if(it.cx!=null){ it.cx+=dx; it.cy+=dy; } } else { it.x+=dx; it.y+=dy; } bpRefresh(); }
}
document.addEventListener("keydown",bpKey);

/* ---- animação entre passos ---- */
function bpStop(){ if(M&&M.play){ cancelAnimationFrame(M.play.raf); M.play=null; } }
function bpLerpFrames(a,b,t){
  const e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2, ka=new Map(a.map(x=>[x.k,x])), out=[], ops={};
  b.forEach(y=>{ const x=ka.get(y.k); if(!x){ out.push(y); ops[y.k]=e; return; }
    const z={...y}; ["x","y","x1","y1","x2","y2","cx","cy","w","h"].forEach(f=>{ if(typeof y[f]==="number" && typeof x[f]==="number") z[f]=x[f]+(y[f]-x[f])*e; }); out.push(z); });
  a.forEach(x=>{ if(!b.some(y=>y.k===x.k)){ out.push(x); ops[x.k]=1-e; } });
  return {out,ops};
}
function bpPlay(){
  if(!M||!M.bp) return;
  if(M.play){ bpStop(); M.fi=M.bp.fr.length-1; bpRefresh(true); return; }
  const fr=M.bp.fr; if(fr.length<2) return;
  M.selK=null; M.play={raf:0}; const DUR=1300, HOLD=450; let i=0, t0=performance.now();
  M.fi=0; bpRefresh(true);
  const step=now=>{
    if(!M||!M.play) return;
    const el=now-t0;
    if(el<HOLD){ M.play.raf=requestAnimationFrame(step); return; }
    const t=Math.min(1,(el-HOLD)/DUR), {out,ops}=bpLerpFrames(fr[i].it,fr[i+1].it,t);
    const g=$("#bpSI"); if(g) g.innerHTML=bpItemsSVG(out,{ops});
    if(t>=1){ i++; M.fi=i; $$("#bpSteps .bpstep").forEach((x,j)=>x.classList.toggle("on",j===i)); t0=now;
      if(i>=fr.length-1){ M.play=null; bpRefresh(true); return; } }
    M.play.raf=requestAnimationFrame(step);
  };
  M.play.raf=requestAnimationFrame(step);
}

/* ---- imagem (PNG) e impressão ---- */
function bpPngBlob(b,fi,scale=2){
  return new Promise((res,rej)=>{
    const s=bpSVG(b,fi,{w:BW}), url="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(s), img=new Image();
    img.onload=()=>{ const c=document.createElement("canvas"); c.width=BW*scale; c.height=BH*scale; const x=c.getContext("2d"); x.drawImage(img,0,0,c.width,c.height); c.toBlob(bl=>bl?res(bl):rej(new Error("png")),"image/png"); };
    img.onerror=()=>rej(new Error("svg")); img.src=url;
  });
}
async function bpPng(){
  const b=bpCollect(), fname=(slug(b.name)||"bola-parada")+(b.fr.length>1?"-passo"+(M.fi+1):"")+".png";
  try{
    const blob=await bpPngBlob(b,M.fi);
    const dl=await use("downloads");
    if(dl){ try{ const u8=new Uint8Array(await blob.arrayBuffer()); await dl.save({filename:fname,data:u8,mimeType:"image/png"}); toast("Imagem guardada"); return; }catch(e){ if(e&&e.code==="declined") return; } }
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=fname; document.body.appendChild(a); a.click(); a.remove(); toast("Imagem descarregada");
  }catch(e){ console.error(e); toast("Não foi possível criar a imagem."); }
}

  const docs = ids.map(i=>D.setpieces[i]?{id:i,...D.setpieces[i]}:null).filter(Boolean);

    ${(b.fr||[]).map((f,i)=>`<div class="bpf">${(b.fr||[]).length>1?`<div class="note"><b>Passo ${i+1}</b></div>`:""}${bpSVG({...b,tt:b.tt},i)}</div>`).join("")}

  printDoc(many?"bolas-paradas":"bola-parada-"+(slug(docs[0].name)||"sem-nome"), many?"Bolas paradas":docs[0].name||"Bola parada", css+idx+docs.map(one).join(""));

    $$("#dlg .bptype").forEach(x=>x.classList.toggle("on",x.dataset.k===M.bpType)); if(nm && (!nm.value.trim()||nm.value===old)) nm.value=BPT(M.bpType).t; },

  bpTool: el => { if(!M||!M.bp) return; M.tool=el.dataset.k; if(M.tool==="del") M.selK=null; bpRefresh(true); },
  bpUndo: () => { if(!M||!M.bp||!M.hist.length) return; bpStop(); M.fut.push(JSON.stringify({fr:M.bp.fr,fi:M.fi})); const s=JSON.parse(M.hist.pop()); M.bp.fr=s.fr; M.fi=Math.min(s.fi,s.fr.length-1); if(M.selK&&!bpFind(M.selK)) M.selK=null; M.dirty=true; bpRefresh(true); },
  bpRedo: () => { if(!M||!M.bp||!M.fut.length) return; bpStop(); M.hist.push(JSON.stringify({fr:M.bp.fr,fi:M.fi})); const s=JSON.parse(M.fut.pop()); M.bp.fr=s.fr; M.fi=Math.min(s.fi,s.fr.length-1); if(M.selK&&!bpFind(M.selK)) M.selK=null; M.dirty=true; bpRefresh(true); },
  bpTpl: () => { if(!M||!M.bp) return; const ty=($("#dlg [name=bptype]")||{}).value||M.bp.type;
    askConfirm(`Repor a colocação do modelo "${BPT(ty).l}" neste passo? (Podes desfazer.)`,"Repor").then(ok=>{ if(!ok||!M||!M.bp) return; bpSnap(); M.bp.fr[M.fi].it=bpTemplate(ty); M.selK=null; bpRefresh(true); }); },
  bpSet: el => { if(!M||!M.bp) return; const it=bpFind(M.selK); if(!it) return; bpSnap(); it[el.dataset.f]=el.dataset.v; bpRefresh(true); },
  bpStraight: () => { const it=M&&M.bp&&bpFind(M.selK); if(!it||it.t!=="ar") return; bpSnap(); it.cx=(it.x1+it.x2)/2; it.cy=(it.y1+it.y2)/2; bpRefresh(true); },
  bpDup: () => { if(!M||!M.bp) return; const it=bpFind(M.selK); if(!it) return; bpSnap(); const o={...clone(it),k:bpNextK()};
    if(o.t==="ar"){ ["x1","x2","cx"].forEach(f=>o[f]+=24); ["y1","y2","cy"].forEach(f=>o[f]+=24); } else { o.x+=28; o.y+=28; } delete o.pid; bpItems().push(o); M.selK=o.k; bpRefresh(true); },
  bpDelSel: () => { if(!M||!M.bp||!M.selK) return; bpSnap(); M.bp.fr[M.fi].it=bpItems().filter(x=>x.k!==M.selK); M.selK=null; bpRefresh(true); },
  bpRoster: el => { if(!M||!M.bp) return; const pl=P(el.dataset.p); if(!pl) return; const it=M.selK&&bpFind(M.selK);
    if(it && (it.t==="p"||it.t==="g")){ bpSnap(); it.n=pl.name; it.pid=pl.id; bpRefresh(true); return; }
    bpSnap(); const n=bpItems().filter(x=>x.t==="p").length, o={k:bpNextK(),t:"p",x:120+(n%8)*34,y:600+Math.floor(n/8)%2*40,n:pl.name,pid:pl.id,c:"w"};
    bpItems().push(o); M.selK=o.k; M.tool="sel"; bpRefresh(true); toast(`${pl.name} no campo — arrasta para o colocar.`); },
  bpFrame: el => { if(!M||!M.bp) return; bpStop(); M.fi=+el.dataset.k; if(M.selK&&!bpFind(M.selK)) M.selK=null; bpRefresh(true); },
  bpFrameAdd: () => { if(!M||!M.bp) return; bpStop(); bpSnap(); M.bp.fr.splice(M.fi+1,0,{it:clone(bpItems())}); M.fi++; bpRefresh(true); toast(`Passo ${M.fi+1}: mexe os jogadores para onde vão.`); },
  bpFrameDel: () => { if(!M||!M.bp||M.bp.fr.length<2) return; bpStop(); bpSnap(); M.bp.fr.splice(M.fi,1); M.fi=Math.max(0,M.fi-1); if(M.selK&&!bpFind(M.selK)) M.selK=null; bpRefresh(true); },
  bpPlay: () => bpPlay(),
  bpPng: () => { if(M&&M.bp) bpPng(); },
  bpPrint: () => { if(!M||!M.bp) return; const id=M.bpId;   // no editor: guarda e descarrega logo (o editor fica aberto)
    const go=()=>{ PRINT_MODE="dl"; bpPrint(id); };
    if(M.dirty){ askConfirm("Guardar as alterações antes de criar o PDF?","Guardar e criar PDF").then(ok=>{ if(!ok||!M||!M.bp) return; put("setpieces",id,bpCollect()); M.dirty=false; go(); }); }
    else go(); },
  bpPrintAll: () => bpPrintForm(),
  bpPrSel: el => { const k=el.dataset.k; $$("#dlg [name=bpsel]").forEach(c=>{ if(k==="*") c.checked=true; else if(k==="") c.checked=false; else if(c.dataset.t===k) c.checked=true; }); bpPrCount(); },
  bpPrLay: el => { if(!M) return; M.bpLay=el.dataset.k; $$("#dlg [data-a=bpPrLay]").forEach(b=>b.classList.toggle("on",b===el)); },
  bpPrGo: el => { if(!M) return; const ids=$$("#dlg [name=bpsel]:checked").map(c=>c.value), lay=M.bpLay;
    if(!ids.length) return toast("Escolhe pelo menos uma bola parada.");
    closeModal(); PRINT_MODE=el.dataset.k; PRINT_WIN=null; if(PRINT_MODE==="open"){ try{ PRINT_WIN=window.open("","_blank"); }catch(e){} }
    bpPrint(ids.join(","),lay); },
  bpCopy: el => { const s=D.setpieces[el.dataset.id]; if(!s) return toast("Esta bola parada já não existe."); const id=bpCopyDoc(s); toast(`Cópia criada: ${D.setpieces[id].name}`); bpEditor(id); },
  bpCopyEd: () => { if(!M||!M.bp) return; const src=M.bpId;
    const go=()=>{ if(!M||!M.bp) return; bpStop(); const id=bpCopyDoc(D.setpieces[src]||bpCollect()); bpEditor(id); toast("Cópia criada — estás a editar a cópia; o original ficou igual."); };
    if(M.dirty){ askConfirm("Guardar as alterações no original antes de criar a cópia?","Guardar e duplicar").then(ok=>{ if(!ok||!M||!M.bp) return; put("setpieces",src,bpCollect()); M.dirty=false; go(); }); }
    else go(); }
});

o cartaz enviado pela equipa)
const SCHED_DEF=[["Concentração",-200],["Almoço",-180],["Palestra tática",-130],["Saída do autocarro",-100],["Chegada ao campo",-80],
  ["Reconhecimento do relvado",-75],["Equipar",-65],["Aquecimento GR",-40],["Aquecimento da equipa",-30],["Retorno ao balneário",-10],["Jogo",0]];
const FCOND="'Barlow Condensed','Avenir Next Condensed','Arial Narrow',Arial,sans-serif", FTXT="'Barlow','Helvetica Neue',Arial,sans-serif";
const hm = t => { const m=/^(\d{1,2})[:h.](\d{2})$/.exec(String(t||"").trim()); return m?(+m[1])*60+(+m[2]):null; };
const hmTxt = (n,sep=":") => n==null?"":pad(Math.floor(((n%1440)+1440)%1440/60))+sep+pad(((n%60)+60)%60);
const hTxt = t => { const n=hm(t); return n==null?(t||""):hmTxt(n,"h"); };   // "15:00" -> "15h00"
const fullName = p => (p && (p.full||p.name)) || "";
function convGames(){ return games().slice().sort(byDT); }
function convDefaultGame(){ const t=todayISO(), gs=convGames(); return (gs.find(g=>g.date>=t && !g.closed)||gs[gs.length-1]||{}).id||null; }
function convCoach(g){ if(g.coach) return g.coach; const s=staff().find(x=>/principal/i.test(x.role||"")); return s?s.name:""; }
function convList(g){   // convocados com o número deste jogo, por ordem de número
  const cn=g.cnum||{};
  return (g.call||[]).map(P).filter(Boolean).map(p=>({p,num:cn[p.id]!=null&&cn[p.id]!==""?cn[p.id]:p.n,obs:(g.cobs||{})[p.id]||""}))
    .sort((a,b)=>((parseNum(a.num)??999)-(parseNum(b.num)??999))||BYPOS(a.p,b.p));
}
function convSides(g){ const m=meta(), o=oppByName(g.opp), home=g.venue!=="F";
  const us={name:"CF Estrela da Amadora"+(m.team&&/\bB\b/.test(m.team)?" B":""),short:m.team||"Estrela B",img:CREST}, them={name:g.opp||"Adversário",short:g.opp||"Adversário",img:oppCrestSrc(o)};
  return home?[us,them]:[them,us]; }
function schedOf(g){
  if((g.sched||[]).length) return g.sched;
  const k=hm(g.time); if(k==null) return [];
  return SCHED_DEF.map(([l,d])=>({l,t:l==="Concentração"&&hm(g.meetT)!=null?g.meetT:hmTxt(k+d)}));
}

/* ---- sub-aba ---- */
function vConv(){
  const gs=convGames();
  if(!gs.length) return `<div class="empty" style="margin-top:14px"><b>Sem jogos</b>Cria o jogo primeiro (+ Novo jogo) para lançares a convocatória.</div>`;
  if(!S.convG || !D.events[S.convG]) S.convG=convDefaultGame();
  const id=S.convG, g={id,...D.events[id]}, pls=players(), call=g.call||[], list=convList(g), sc=schedOf(g), saved=(g.sched||[]).length>0;
  const F=(f,label,val,type="text",extra="")=>`<label class="fld">${label}<input type="${type}" value="${esc(val??"")}" data-c="f" data-col="events" data-id="${esc(id)}" data-f="${f}" ${extra}></label>`;
  const opt=x=>({v:x.id,l:`${fmtD(x.date,{day:"numeric",month:"short"})} — ${x.venue==="F"?"@":"vs"} ${x.opp||"?"}${x.phase?" ("+x.phase+")":""}`});
  const tile=p=>{ const on=call.includes(p.id), av=avail(p.id);
    return `<button class="tile ${on?"on":"off"}" data-a="call" data-id="${esc(id)}" data-p="${esc(p.id)}">${av!=="ok"?`<span class="flag ${av==="cond"?"cond":""}" title="${AV[av].l}"></span>`:""}${avatar(p)}<b>${esc(p.name)}</b><span class="st">${on?"Convocado":av!=="ok"?AV[av].l:"Fora"}</span></button>`; };
  const byGroup=fn=>["GR","DEF","MED","ATA","X"].map(k=>{ const l=pls.filter(p=>GROUP(p.pos)===k); return l.length?`<div class="gsec">${GNAME[k]}</div><div class="tiles">${l.map(fn).join("")}</div>`:""; }).join("");
  return `
  <section class="card"><div class="card-h"><h3>Jogo</h3>${sel("",gs.map(opt),id,'data-c="convG" class="inp" style="max-width:340px" aria-label="Jogo"')}</div><div class="card-b"><div class="form">
    ${F("comp","Prova",g.comp,"text",'placeholder="Ex.: III Divisão Distrital"')}${F("phase","Jornada",g.phase,"text",'placeholder="Ex.: Jornada 1"')}
    <label class="fld">Casa / fora${sel("",[{v:"C",l:"Casa (visitado)"},{v:"F",l:"Fora (visitante)"}],g.venue||"C",`data-c="f" data-col="events" data-id="${esc(id)}" data-f="venue"`)}</label>
    ${F("place","Local do jogo",g.place,"text",'placeholder="Ex.: Campo Municipal"')}
    ${F("date","Data",g.date,"date")}${F("time","Hora do jogo",g.time,"time")}
    ${F("meetT","Hora de concentração",g.meetT,"time")}${F("meetP","Local de concentração",g.meetP,"text",'placeholder="Ex.: Estádio Municipal"')}
    ${F("coach","Treinador",g.coach,"text",`placeholder="${esc(convCoach({}))}"`)}
    <label class="fld full">Observações<input value="${esc(g.cnote??"")}" data-c="f" data-col="events" data-id="${esc(id)}" data-f="cnote" placeholder="Números sujeitos a alterações!"></label>
  </div></div></section>
  <section class="card"><div class="card-h"><h3>Convocados</h3><span class="sub">${call.length} convocados</span></div><div class="card-b">${byGroup(tile)}</div></section>
  ${atConvCard(g)}

/* ---- exportar: PDF (página A4 inteira) e PNG ---- */
let FONT_CSS=null;
async function convFontCSS(){   // as imagens SVG não usam as fontes da página: embute a Barlow (se houver rede)
  if(FONT_CSS!=null) return FONT_CSS;
  try{
    const ctl=new AbortController(); const tm=setTimeout(()=>ctl.abort(),5000);
    const css=await (await fetch("https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@700;800&display=swap",{signal:ctl.signal})).text();
    const blocks=css.split("@font-face").filter(b=>/\/\* latin \*\//.test("/* latin */"+b) && /U\+0000-00FF/.test(b));
    let out="";
    for(const b of blocks){ const u=(/url\((https:[^)]+)\)/.exec(b)||[])[1]; if(!u) continue;
      const buf=await (await fetch(u,{signal:ctl.signal})).arrayBuffer(); let bin=""; const by=new Uint8Array(buf); for(let i=0;i<by.length;i+=8192) bin+=String.fromCharCode.apply(null,by.subarray(i,i+8192));
      out+="@font-face"+b.replace(/url\([^)]+\)/,`url(data:font/woff2;base64,${btoa(bin)})`); }
    clearTimeout(tm); FONT_CSS=out;
  }catch(e){ FONT_CSS=""; }
  return FONT_CSS;
}
async function inlineImgs(svg){   // imagens de fora (fotos do Drive/assets) passam a dataURL para entrarem no PNG
  const urls=[...new Set([...svg.matchAll(/href="((?!data:)[^"]+)"/g)].map(m=>m[1]))];
  for(const u of urls){ try{ const bl=await (await fetch(u.replace(/&amp;/g,"&"))).blob(); const du=await new Promise(r=>{ const f=new FileReader(); f.onload=()=>r(f.result); f.readAsDataURL(bl); }); svg=svg.split(`href="${u}"`).join(`href="${du}"`); }
    catch(e){ svg=svg.split(`href="${u}"`).join(`href=""`); } }
  return svg;
}
async function svgPng(svg,scale=2,type="image/png"){
  const css=await convFontCSS(); svg=await inlineImgs(svg);
  if(css) svg=svg.replace(/^<svg([^>]*)>/,`<svg$1 width="${CW}" height="${CH}"><style>${css}</style>`); else svg=svg.replace(/^<svg([^>]*)>/,`<svg$1 width="${CW}" height="${CH}">`);
  return new Promise((res,rej)=>{ const img=new Image();
    img.onload=()=>{ const c=document.createElement("canvas"); c.width=CW*scale; c.height=CH*scale; const x=c.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height); c.toBlob(b=>b?res(b):rej(new Error("png")),type,0.9); };
    img.onerror=()=>rej(new Error("svg")); img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg); });
}
async function saveBlob(blob,fname,mime){
  const dl=await use("downloads");
  if(dl){ try{ await dl.save({filename:fname,data:new Uint8Array(await blob.arrayBuffer()),mimeType:mime}); toast("Guardado"); return; }catch(e){ if(e&&e.code==="declined") return; } }
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=fname; document.body.appendChild(a); a.click(); a.remove(); toast("Descarregado");
}
function convPdf(pages,fname,title){
  const html=`<!DOCTYPE html><html lang="pt-PT"><head><meta charset="utf-8"><title>${esc(title)}</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#777;-webkit-print-color-adjust:exact;print-color-adjust:exact}.pg{width:210mm;height:297mm;margin:10px auto;background:#fff;box-shadow:0 4px 18px rgba(0,0,0,.35);overflow:hidden;page-break-after:always}.pg:last-child{page-break-after:auto}.pg svg{width:100%;height:100%;display:block}
@page{size:A4;margin:0}@media print{html,body{background:#fff}.pg{margin:0;box-shadow:none}}</style></head><body>
${pages.map(p=>`<div class="pg">${p}</div>`).join("")}<script>window.onload=function(){setTimeout(function(){try{window.print();}catch(e){}},600);};<\/script></body></html>`;
  openPrintable(fname,html);
}

/* ================= app do atleta — lado da equipa técnica (só na versão do Estrela) =================
   Cada atleta tem um código pessoal (players.atk, 24 caracteres ao acaso). O link pessoal leva o endereço do site da
   app do atleta (meta/cfg.atletaUrl), o endereço do script da partilha (o mesmo da partilha deste dispositivo) e o código:
     <site>/#s=<script>&t=<código>
   O script da partilha (dados_app.gs, secção "APP DO ATLETA") só aceita estes códigos e só devolve dados desse atleta.
   Gerar um link novo invalida o anterior. A convocatória só aparece na app do atleta depois de publicada (events.convPub). */
const atOn = () => EDITION==="estrela";
const atSite = () => { const v=String(cfg().atletaUrl||"").trim().replace(/[#?].*$/,"").replace(/\/+$/,""); return v&&!/^https?:\/\//i.test(v)?"https://"+v:v; };
const atLink = p => p && p.atk && SYNC.cfg && atSite() ? `${atSite()}/#s=${encodeURIComponent(SYNC.cfg.url)}&t=${p.atk}` : "";
/* endereço escrito à mão: aceita sem https:// e sem barra final; recusa o próprio site da equipa técnica */
function atNormSite(v){
  v=String(v||"").trim().replace(/\s+/g,""); if(!v) return {v:""};
  if(!/^https?:\/\//i.test(v)) v="https://"+v;
  v=v.replace(/^http:\/\//i,"https://").replace(/[#?].*$/,"").replace(/\/+$/,"");
  let u; try{ u=new URL(v); }catch(e){ return {err:"Endereço inválido. Exemplo: estrela-b-atleta.netlify.app"}; }
  if(!/\./.test(u.hostname)) return {err:"Endereço inválido. Exemplo: estrela-b-atleta.netlify.app"};
  if(/^https?:$/.test(location.protocol) && u.host===location.host && (u.pathname.replace(/\/+$/,"")===location.pathname.replace(/\/(index\.html)?$/,"").replace(/\/+$/,"")))
    return {err:"Esse é o endereço desta app (da equipa técnica). A app do atleta tem de ser um site Netlify à parte: cria um site novo e arrasta lá a pasta atleta."};
  return {v:u.origin+u.pathname.replace(/\/+$/,"")};
}
function atSaveSite(raw){ const r=atNormSite(raw); if(r.err){ toast(r.err); return false; }
  put("meta","cfg",{...clone(cfg()),atletaUrl:r.v}); toast(r.v?"Endereço guardado — os links estão prontos":"Endereço apagado"); return true; }
function atToken(){ const b=new Uint8Array(18); crypto.getRandomValues(b); return btoa(String.fromCharCode(...b)).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
const atMsg = (p,link) => `Olá ${firstName(p.name)}! Este é o teu link pessoal para a app do atleta do ${meta().team||"Estrela B"}: bem-estar de manhã, PSE depois do treino, agenda e convocatórias. Abre-o no teu telemóvel e adiciona ao ecrã principal. É só teu — não partilhes. ${link}`;
function atMissing(){
  if(!SYNC.cfg) return `<p class="note" style="margin:0">A app do atleta recebe os dados pela <b>partilha com a equipa técnica</b>. Liga-a primeiro em Plantel → "Partilhar com a equipa técnica".</p>`;
  if(!atSite()) return `<p class="note" style="margin:0 0 8px">Falta o endereço do site da app do atleta (o site Netlify onde publicaste a pasta <b>dist/atleta</b>).</p><button class="btn sm primary" data-a="atSiteCfg">Definir o endereço</button>`;
  return "";
}
/* ---- ficha do atleta ---- */
function atCard(pid){
  if(!atOn()) return "";
  const p=P(pid); if(!p) return "";
  const miss=atMissing(), link=atLink(p);
  return `<section class="card"><div class="card-h"><h3>App do atleta</h3>${p.atk?`<span class="tag ok">Link criado</span>`:""}</div><div class="card-b">
    ${miss || (p.atk ? `<label class="fld full">Link pessoal (só para ${esc(firstName(p.name))})<input readonly value="${esc(link)}" id="atL_${esc(pid)}"></label>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn sm primary" data-a="atCopy" data-id="${esc(pid)}">Copiar</button>
      <a class="btn sm" href="https://wa.me/?text=${encodeURIComponent(atMsg(p,link))}" target="_blank" rel="noopener">WhatsApp</a>
      <button class="btn sm ghost" data-a="atGen" data-id="${esc(pid)}">Novo link</button></div>
      <p class="note">Envia só a ${esc(firstName(p.name))}, em privado. "Novo link" desliga o anterior (ex.: telemóvel perdido ou link partilhado).</p>`
    : `<p class="note" style="margin:0 0 8px">Com o link pessoal, ${esc(firstName(p.name))} responde ao bem-estar e ao PSE na app (em vez dos formulários) e vê a agenda, a convocatória e os seus números.</p><button class="btn sm primary" data-a="atGen" data-id="${esc(pid)}">Criar link pessoal</button>`)}
  </div></section>`;
}
/* ---- Plantel: todos os links ---- */
function atLinksForm(){
  const pls=players(), miss=atMissing(), sem=pls.filter(p=>!p.atk).length;
  modal({title:"App do atleta",sub:"Links pessoais — um por atleta, enviados em privado",big:true,body:`

    <div class="list">${pls.map(p=>{ const l=atLink(p); return `<div class="li"><span class="main"><b>${esc(p.name)}</b><small>${p.atk?(l?"Link criado":"Link criado — falta o endereço do site"):"Sem link"}</small></span>
      ${l?`<button class="btn sm" data-a="atCopy" data-id="${esc(p.id)}">Copiar</button><a class="btn sm" href="https://wa.me/?text=${encodeURIComponent(atMsg(p,l))}" target="_blank" rel="noopener">WhatsApp</a>`
        :p.atk?"":`<button class="btn sm" data-a="atGen" data-id="${esc(p.id)}">Criar</button>`}</div>`; }).join("")}</div>
    <p class="note">Nunca envies os links num grupo: cada um é a identidade do atleta na app. As respostas vão para as mesmas folhas dos formulários, por isso a monitorização continua igual (e os formulários continuam a funcionar).</p>`,
    foot:`<span></span><span class="right"><button class="btn" data-a="mClose">Fechar</button><button class="btn primary" data-a="mSave">Guardar endereço</button></span>`,
    ctx:{save:()=>{ if(atSaveSite(fv("site"))) atLinksForm(); }}});
  const inp=$("#dlg input[name=site]"); if(inp) inp.addEventListener("change",()=>{ if(atNormSite(inp.value).v!==atSite() && atSaveSite(inp.value)) atLinksForm(); });
}
function atSiteForm(){
  modal({title:"Site da app do atleta",body:`<p class="small muted" style="margin:0 0 10px">O endereço do site Netlify onde publicaste a pasta <b>dist/atleta</b>.</p>

    ctx:{save:()=>{ if(!fv("site")) return toast("Escreve o endereço do site."); if(atSaveSite(fv("site"))) closeModal(); }}});

/* ---- Jogos → Convocatória: publicar na app ---- */
function atConvCard(g){

const tacZone = k => (TAC_POS[k]||["","mc"])[1];

const tacXY = (t,k) => { const s=(t.sl||{})[k]||{}, f=(TAC_FORMS[t.form]||{})[k]||[50,50]; return [s.x!=null?s.x:f[0], s.y!=null?s.y:f[1]]; };
const tacPx = ([x,y]) => [20+x/100*(TW-40), 20+y/100*(TH-100)];
function tacNew(form){ const sl={}; Object.keys(TAC_FORMS[form]).forEach(k=>{ const [r,d]=TAC_DEF[tacZone(k)]; sl[k]={r,d}; }); return sl; }
// muda a formação: posições com o mesmo nome ficam; os atletas das que desaparecem vão para a posição livre mais próxima
function tacRemap(t,form){
  const nf=TAC_FORMS[form], old=t.sl||{}, sl={}, lost=[];
  Object.keys(nf).forEach(k=>{ const [r,d]=TAC_DEF[tacZone(k)]; sl[k]=old[k]?{...old[k]}:{r,d}; delete sl[k].x; delete sl[k].y; });
  Object.keys(old).forEach(k=>{ if(!nf[k] && old[k].p) lost.push({p:old[k].p, xy:(TAC_FORMS[t.form]||{})[k]||[50,50]}); });
  lost.forEach(({p,xy})=>{ const free=Object.keys(nf).filter(k=>!sl[k].p); if(!free.length) return;
    free.sort((a,b)=>Math.hypot(nf[a][0]-xy[0],nf[a][1]-xy[1])-Math.hypot(nf[b][0]-xy[0],nf[b][1]-xy[1])); sl[free[0]].p=p; });
  return sl;
}
const tacShort = n => { n=String(n||""); return n.length>13 ? n.split(" ").map((w,i,a)=>i<a.length-1?w[0]+".":w).join(" ") : n; };

  modal({title:`${TAC_POS[k][0]} <span class="muted" style="font-weight:600">(${k})</span>`,body,foot:footSave(),ctx:{save:()=>{
    const cur=clone(D.tactics[id]); if(!cur) return closeModal(); const sl=cur.sl, np=fv("p");
    const d=($('#dlg [name="d"]:checked')||{}).value||"apo";

/* ---- arrastar posições (modo "Mover posições") ---- */
let TAC_DRAG=null;
document.addEventListener("pointerdown",e=>{
  const g=e.target.closest&&e.target.closest("svg.tac.move g.ts"); if(!g) return;
  const svg=g.ownerSVGElement, id=S.tacId&&D.tactics[S.tacId]?S.tacId:(tactics()[0]||{}).id; if(!id) return;
  e.preventDefault(); try{ g.setPointerCapture(e.pointerId); }catch(er){}
  TAC_DRAG={g,svg,id,k:g.dataset.k,x0:e.clientX,y0:e.clientY,dx:0,dy:0};
});
document.addEventListener("pointermove",e=>{
  if(!TAC_DRAG) return; const r=TAC_DRAG.svg.getBoundingClientRect(), f=TW/r.width;
  TAC_DRAG.dx=(e.clientX-TAC_DRAG.x0)*f; TAC_DRAG.dy=(e.clientY-TAC_DRAG.y0)*f;
  TAC_DRAG.g.setAttribute("transform",`translate(${TAC_DRAG.dx} ${TAC_DRAG.dy})`);
});
const tacDrop=()=>{ const d=TAC_DRAG; TAC_DRAG=null; if(!d||(Math.abs(d.dx)<3&&Math.abs(d.dy)<3)){ if(d) d.g.removeAttribute("transform"); return; }
  const t=clone(D.tactics[d.id]); if(!t) return; const [x,y]=tacXY(t,d.k);
  const nx=Math.max(4,Math.min(96,x+d.dx/(TW-40)*100)), ny=Math.max(3,Math.min(94,y+d.dy/(TH-100)*100));
  t.sl[d.k]={...t.sl[d.k],x:Math.round(nx*10)/10,y:Math.round(ny*10)/10}; put("tactics",d.id,t); };
document.addEventListener("pointerup",tacDrop); document.addEventListener("pointercancel",tacDrop);

async function tacPngBlob(t,scale=2){
  return new Promise((res,rej)=>{ const s=tacSVG(t,{png:true}), img=new Image(), H=TH+78;
    img.onload=()=>{ const c=document.createElement("canvas"); c.width=TW*scale; c.height=H*scale; c.getContext("2d").drawImage(img,0,0,c.width,c.height); c.toBlob(b=>b?res(b):rej(new Error("png")),"image/png"); };
    img.onerror=()=>rej(new Error("svg")); img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(s); });
}
